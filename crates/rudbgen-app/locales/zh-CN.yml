    refSchema: 另一端表的模式
    refTable: 另一端的表
    refColumns: 与本表这边同序排列的另一端的列
    onUpdate: 另一端的行被改动时的动作
    onDelete: 另一端的行被删除时的动作
    position: 在键列表里的位次，从 1 起
    catalog: 在列的 fk 里 — 它指向的表的目录
    schema: 在列的 fk 里 — 它指向的表的模式
    table: 在列的 fk 里 — 它指向的表
    column: 在列的 fk 里 — 它指向的列
  index:
    name: 索引名
    unique: 是否是唯一索引
    columns: 按索引顺序排列的列
    position: 在索引列表里的位次，从 1 起
  stmt:
    item: 写出模型的一个字段，连修饰符一起
    super: 在 for 循环里够到外层的表
    if: 条件成立时写出主体；要有 endif
    elif: 上面那个 if 的另一个分支
    else: 所有分支都不成立时写的东西
    endif: 结束一个 if
    for: 集合里每有一个元素就写一遍主体
    endfor: 结束一个 for
    date: 按 format 说的样子写出的今天
    user: 运行生成器的账号
    author: 生成标签页里的作者一栏
    inStr: 写在两次循环之间的文字；第一次之前和最后一次之后都不写
    indent: 给 inStr 写的东西添的缩进空格，可以是负数
    skipList: 要跳过的元素名，用逗号分开，大小写也要对上
  dec:
    abbr: 把缩写规则套到值上
    suffix: 丢掉第一个下划线之前的部分，T_SAMPLE_ALBUM 变成 SAMPLE_ALBUM
    prefix: 丢掉最后一个下划线之后的部分，SAMPLE_ALBUM_T 变成 SAMPLE_ALBUM
    camel: 小驼峰，SAMPLE_ALBUM 变成 sampleAlbum
    pascal: 大驼峰，SAMPLE_ALBUM 变成 SampleAlbum
    snake: 蛇形，SAMPLE_ALBUM 变成 sample_album
    screaming: 大写蛇形，sampleAlbum 变成 SAMPLE_ALBUM
    skewer: 串形，SAMPLE_ALBUM 变成 sample-album
    kebab: skewer 的别名
    lower: 小写
    upper: 大写
    replace: replace('from','to') 把出现的地方都换掉
    padSize: 用空格把值补到这个宽度
    padDir: 空格补在哪一边，left 或 right，默认 right
    quote: 用这段文字把值两头包起来
    prepend: 在值前面写上这段文字
    postpend: 在值后面写上这段文字
  cond:
    equals: 不分大小写，值等于它就成立
    notEquals: 值不是它就成立
    startsWith: 不分大小写，值以它开头就成立
    notStartsWith: 值不以它开头就成立
    endsWith: 不分大小写，值以它结尾就成立
    notEndsWith: 值不以它结尾就成立
    contains: 集合里有叫这个名字的元素，或逗号分隔的列表里有这个值，就成立
    notContains: 两样都没有就成立
    matches: 整个值匹配这个正则就成立；这里分大小写
    notMatches: 整个值匹配不上这个正则就成立
  opt:
    key: 这条语句要写的字段，连修饰符一起
    item: key 的别名
    format: 日期怎么写，用 Java 的模式字母，如 yyyy-MM-dd

