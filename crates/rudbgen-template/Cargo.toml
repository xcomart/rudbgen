[package]
name = "rudbgen-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "jdbgen's template engine, ported to Rust and byte-compatible with its template assets"

# Every field is written out instead of inherited from the workspace: this
# crate is the first one of rudbgen that is not a copy of a rudbman crate and
# it has to build on its own, before a root manifest exists. The `crates/*`
# glob picks it up unchanged once there is one.

[dependencies]
# EUC-KR byte counting for padding and indentation, jdbgen's column width.
encoding_rs = "0.8"
# the 'matches'/'notmatches' conditions of an if statement.
regex = "1"
# ${date} formatting.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
