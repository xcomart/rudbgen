# Interface strings, compiled into the binary by `rust_i18n::i18n!` in
# `src/main.rs`. This file is the source of truth: every other locale mirrors
# its keys, and a key missing from a translation falls back to the value here.
#
# Not translated anywhere, on purpose: the "rudbgen" and "jdbgen" wordmarks
# themselves, element ids, gpui key names, theme ids, the licence identifier,
# and the `Cmd`/`Ctrl` modifier names.
#
# This is the M0 set: the application shell and nothing that is not on screen
# yet. The connection dialog, the explorer tree, the Generate tab and the
# template editor bring their own namespaces as they arrive.
_version: 1

# What this language calls itself, for the settings dialog's language list.
# Written in the language of this file and never translated into another one:
# a user who has landed in a language they cannot read has to be able to find
# their own in the list. Every locale file must define it — the list of shipped
# languages is derived from these files, and this key is what names each entry.
language:
  name: English

# Shared by more than one dialog.
common:
  cancel: Cancel
  save: Save
  close: Close

# The body of the window once a session is open. The explorer, the inspector
# and the tabbed work area they flank are what comes next; until they exist, a
# connected window says which database it is holding and what is still to
# come, rather than showing an empty three-column frame.
workarea:
  next: The Generate tab arrives in the next milestone; the explorer and the inspector are already here.

# The explorer: the tree of tables down the left, and the ticks that say which
# of them the generator will be run over.
explorer:
  title: Explorer
  # The filter box over the tree; jdbgen's rule, which is contains, ignoring case.
  filter_placeholder: Filter tables
  show_views: Show views
  # The placeholder row under a schema whose tables are still on their way.
  loading: loading…
  # An error row whose message went missing. Only reachable through a bug, but a
  # blank row would be worse than a word.
  load_failed_unknown: This could not be loaded.

  # The right-click menu. "Shown" rather than "all": the three commands act on
  # the rows on screen, which is what the filter and the views toggle left.
  menu_select_shown: Select all shown
  menu_clear: Clear selection
  menu_invert: Invert selection
  menu_inspect: Open in inspector
  menu_refresh: Refresh

# The inspector: what one table is made of.
#
# Never translated: SQL keywords — NULL, NOT NULL, PK, UNIQUE, CASCADE, SET NULL
# — nor type names, which are the driver's own words and what the DDL says.
inspector:
  title: Inspector
  tab_columns: Columns
  tab_keys: Keys
  tab_foreign_keys: Foreign keys
  tab_indexes: Indexes
  # Nothing has been picked yet. The panel is on screen and empty rather than
  # absent, because it is where the answer will appear.
  empty: Pick a table to see what it is made of.
  # While the fetch for the table on screen is out.
  loading: loading…
  refresh: Refresh
  # A table that has none of whatever the tab lists — no indexes, no foreign keys
  # — as against one that could not be read.
  nothing_here: nothing here

  # Column headings.
  column: Column
  columns: Columns
  type: Type
  # Quoted: bare `Null` is YAML's null literal and would load as an empty
  # heading. The word is the SQL keyword and is not translated.
  nullable: "Null"
  default: Default
  key: Key
  comment: Comment
  name: Name
  seq: Position
  unique: Unique
  target: References
  source: Referenced by
  on_update: On update
  on_delete: On delete

  # Section headings, named by what they mean rather than by JDBC's "imported"
  # and "exported", which do not say which way the key points.
  references_out: Foreign keys of this table
  references_in: Foreign keys pointing at this table

connect:
  title: Connections
  # The list, and the profile being edited.
  new: New
  # Name a profile is created under. Replaced as soon as the user types.
  new_name: New connection
  duplicate: Duplicate
  delete: Delete
  delete_confirm: "Delete the connection “%{name}” and its saved password?"
  # Shown in the list for a profile the user has not named yet.
  unnamed: "(unnamed)"
  copy_name: "%{name} (copy)"

  name: Name
  folder: Folder
  color: Tag
  driver: Driver
  pick_driver: Choose a driver
  manage_drivers: Drivers…
  driver_has_no_jar: This driver has no JAR yet. Add or download one under Drivers.

  # The fields a driver's URL template is broken into. `database` heads whatever
  # the template calls it — a database, a service, a SID or a file — because the
  # question is the same one whatever the product names it.
  host: Host
  port: Port
  database: Database
  url: URL
  url_hint: Assembled from the fields above. Editing it directly keeps what you type.
  url_overridden: Typed by hand; the fields above no longer change it.
  url_reset: Rebuild

  username: User
  password: Password
  props: Driver properties
  prop_key: property
  prop_value: value
  add_prop: Add a property

  section:
    behaviour: Behaviour
    tunnel: SSH tunnel

  read_only: Open the connection read-only
  auto_commit: Commit each statement as it runs
  confirm_writes: Ask before running a write statement
  keep_alive: Keep the connection alive with a periodic query

  # The tunnel block. A production database usually sits behind a bastion host;
  # rudbgen forwards a local port through it and points JDBC at that port.
  tunnel_enabled: Connect through an SSH bastion
  tunnel_host: Bastion
  tunnel_user: Bastion user
  tunnel_auth: Authentication
  tunnel_auth_agent: SSH agent
  tunnel_auth_key: Private key
  tunnel_auth_password: Password
  tunnel_key: Key file
  tunnel_password: Bastion password
  tunnel_passphrase: Key passphrase
  tunnel_remote: Database
  tunnel_hint: The database is named as the bastion sees it. rudbgen binds a free local port and connects the driver to that.

  # The buttons along the bottom, and what they report.
  test: Test
  testing: Connecting…
  test_ok: "Connected to %{product}."
  # The driver answered nothing useful about the product, but the session opened
  # and answered a PING.
  test_ok_unnamed: The connection works.
  test_failed: "Could not connect: %{error}"
  test_failed_hint: "Could not connect: %{error} — %{hint}"
  connect: Connect
  saved: Saved.

  name_required: Give the connection a name.
  url_required: The connection has no URL.
  no_driver: "No driver definition named “%{driver}”."
  load_failed: "The saved connections could not be read: %{error}"
  save_failed: "The connections could not be saved: %{error}"
  keychain_failed: "The password could not be saved to the keychain: %{error}"

  # One-line suggestions attached to a failure whose SQLSTATE class says what
  # kind it is.
  hint_auth: check the user name and password
  hint_driver: check the driver JAR and the driver class
  hint_jvm: rudbgen needs a Java runtime; set RUDBGEN_JAVA_HOME or JAVA_HOME
  hint_network: check the host, the port and whether the database is reachable
  hint_host_key: the bastion's host key is not trusted yet

  # Trust on first use. The fingerprint is shown in full because comparing it
  # against what the machine's administrator published is the whole point;
  # neither it nor the algorithm name is translated.
  host_key_question: "%{host} presented an unknown %{algorithm} key: %{fingerprint}"
  trust_host_key: Trust this key
  host_key_trusted: The host key was added to the trusted list. Try connecting again.

  # What the welcome screen and the status bar say when an attempt did not
  # get through. The reason underneath comes from the driver, the bastion or
  # the JVM and is not translated.
  could_not_open: "%{name} could not be opened."
  tunnel_ended: "The SSH tunnel ended: %{reason}"

driver:
  title: Drivers
  name: Name
  class: Driver class
  class_hint: The fully qualified class name, as the driver's own documentation gives it — for example org.postgresql.Driver.
  # Reads the class out of the registered JARs instead of making the user find
  # it. The first probe of a session starts the Java runtime, so it can take a
  # few seconds.
  detect: Detect
  detecting: Looking inside the JAR files…
  probe_found: "Found %{class}."
  # More than one java.sql.Driver in the archive. The vendor's own
  # META-INF/services declaration is marked and preselected; the rest are
  # usually internal or deprecated drivers.
  probe_choose: This driver offers several classes. Pick the one to connect with.
  probe_recommended: recommended
  # A perfectly good archive with no driver in it, which is what a sources or
  # javadoc JAR looks like — the mistake that is actually made.
  probe_none: These files hold no JDBC driver. A sources or javadoc JAR looks like this; check that the right file was picked.
  # The archive started reading and then failed, which means the bytes are bad
  # rather than the file being the wrong one.
  probe_damaged: "The file is damaged and could not be read to the end; download it again. (%{error})"
  probe_missing: "The JAR file could not be found: %{error}"
  probe_jvm_failed: "The Java runtime could not be started: %{error}"
  probe_failed: "The JAR files could not be examined: %{error}"
  url_template: URL template
  default_port: Default port
  dialect: Dialect
  maven: Maven coordinate
  jars: JAR files
  add_jar: Add a JAR…
  # Confirmation button of the file dialog the button above opens.
  add_jar_select: Add
  remove_jar: Remove
  jar_missing: missing
  no_jar: no JAR
  no_jar_hint: A driver needs at least one JAR before a connection can use it.
  jar_count: "%{count} JAR(s)"
  download: Download
  downloading: "Downloading %{file}…"
  downloading_percent: "Downloading %{file} — %{percent}%"
  downloaded: "%{file} was downloaded and added."
  download_cancelled: The download was cancelled.
  bad_coordinate: "“%{coordinate}” is not a group:artifact:version coordinate."
  not_found: "Maven Central has nothing at %{url}."
  network_failed: "The download failed: %{error}"
  # The bytes that arrived do not hash to what Maven Central published beside
  # them, which means the transfer was corrupted.
  checksum_failed: "The download is corrupted: expected SHA-1 %{expected}, got %{actual}."
  load_failed: "The driver definitions could not be read: %{error}"
  save_failed: "The driver definitions could not be saved: %{error}"
  new: New
  new_name: New driver
  delete: Delete
  delete_confirm: "Delete the driver definition “%{name}”?"
  none_selected: Select a driver, or add one.

  # jdbgen calls it noAuth. The connection form then leaves the two credential rows out rather than greying them: there is no question to answer.
  no_auth: This product has no user and no password

# The four per-driver SQL overrides of the driver editor (architecture
# document, D9), and the Test button that runs one and checks what came back.
#
# Never translated: the column names of the contract, the ${catalog},
# ${schema} and ${table} holes, and the statements themselves.
custom_query:
  section: Custom queries
  section_hint: SQL for what this driver reports badly, or not at all. Inherited from jdbgen; a statement is sent only while its box is ticked.
  # Heads the three little fields the test substitutes the holes from.
  test_values: "Test with"
  tables: Table list
  columns: Column list
  table_comments: Table comments
  column_comments: Column comments
  test: Test
  testing: Running…
  ok: "OK — %{rows} rows, and every column the reader needs is there."
  missing: "Missing columns: %{labels}"
  wrong_columns: "%{expected} columns are read; %{actual} came back."
  failed: "The statement failed: %{error}"
  empty: There is no statement to test.
  no_session: Connect to a database that uses this driver first — the test runs the statement on that session.
  contract_labels: "Must return these columns, by name: %{labels}"
  contract_positional: "Must return %{columns} columns, in this order: %{names}"
  pair_table: table name, comment
  pair_column: column name, comment
  placeholders: "Filled in before the statement runs: %{names}"

# The in-app dropdown menu, and the macOS menu bar below it. The two differ
# only in capitalisation in English, but a translation may need to distinguish
# them, so they are separate keys.
#
# An ellipsis marks a row that asks something before it acts, which is every
# row here except "About" and "Quit".
menu:
  new_connection: New connection…
  settings: Settings…
  # Shows and hides the explorer sidebar, which only a connection puts on
  # screen; greyed until then.
  toggle_explorer: Explorer
  # Shows and hides the inspector panel, the explorer's opposite number.
  toggle_inspector: Inspector
  about: About rudbgen
  # Both the in-app row and the macOS menu-bar item, and also the title of the
  # dialog it opens — so no trailing ellipsis, which would read oddly as a
  # heading.
  check_updates: Check for updates
  quit: Quit
  # Name of the macOS menu bar's second menu, the one holding the commands that
  # act on connections.
  connection: Connection
  # Name of its third, holding what changes the layout of the window.
  view: View
  # Hover label of the button that opens the in-app menu.
  tip_menu: Menu
  mac:
    new_connection: New Connection…
    quit: Quit rudbgen

# The title bar: the connection selector and the two buttons beside it.
# The selector reads `no_connection` until a session is open, which in M0 is
# always.
titlebar:
  no_connection: No connection
  tip_settings: Settings
  # The row that closes the session rather than opening one, on the end of
  # the list while one is open, and what the trigger reads while a session is
  # still opening.
  disconnect: Disconnect
  connecting: "%{name} — connecting…"
  tip_help: Help

# The welcome screen: the whole body of the window while no connection is
# open. The name, what the application is for, the three ways in, and the
# connections already saved.
welcome:
  # The line under the application's name.
  tagline: Point it at a database, pick tables and templates, and it writes the code.
  # Shown under the buttons once something is saved. `%{shortcut}` is "Cmd+N"
  # or "Ctrl+N"; neither is translated.
  hint: Press %{shortcut} to open a new connection.
  # The three buttons. Each takes the ellipsis for the same reason the menu
  # rows do: they ask before they act.
  new_connection: New connection…
  import_jdbgen: Import from jdbgen…
  open_template: Open a template…
  # Heading of the saved list, and what stands in its place on a first run.
  saved: Saved connections
  empty: No connections saved yet.
  # Hover label of a button whose milestone has not arrived. Said plainly:
  # a button that looks live and does nothing is worse than one that says so.
  tip_soon: Not built yet.

# The bar along the bottom. It reports the connection and the arithmetic of
# the run — tables × templates → files — and in M0 there is neither.
statusbar:
  no_connection: no connection
  no_selection: nothing to generate
  # The first half of §4.2's arithmetic; the templates and the file count join
  # it with the Generate tab. Quoted, so the leading interpolation cannot be
  # read as YAML's own syntax.
  tables_selected: "%{count} tables selected"
  # The three states of the left cell once a connection has been asked for.
  # `%{product}` is what SESSION_INFO named, which is a value and not a word.
  connecting: "connecting to %{name}…"
  connected: "%{name} · %{product}"
  failed: "%{name} — not connected"
  unknown_product: unknown product

# The about box. The version, the licence name and the names of the libraries
# are values, not words, and are never translated.
about:
  title: About rudbgen
  version: "Version %{version}"
  tagline: A database code generator that renders jdbgen's templates in Rust and draws its interface with gpui.
  license: "Licensed under %{license}."
  credits: Built with gpui (vendored and patched).

# The settings dialog and the theme editor inside it.
#
# Never translated: hex colour values, the `#RRGGBB` notation, JVM flags and
# the slot keys of a theme file. The slot *labels* below are translated — they
# name what a colour is for, not what the file calls it.
settings:
  title: Settings
  # Heads both dropdowns, and doubles as their placeholder so a trigger reads
  # the same whether or not its list is open.
  system_default: Use the system setting
  save_failed: "The settings could not be saved: %{error}"

  section:
    appearance: Appearance
    window: Window
    language: Language
    generation: Generation
    jvm: Java virtual machine

  ui_theme: Interface theme
  editor_theme: Editor theme
  editor_follows_ui: Match the editor theme to the interface theme
  ui_font_size: Interface size
  editor_font: Editor font
  editor_font_size: Editor size
  # Unit hint after a narrow field. A range, so it reads the same everywhere.
  font_size_hint: 6 – 32 pt

  opacity: Opacity
  opacity_hint: "% — below 100 lets the desktop show through"
  blur: Blur the desktop behind the window
  titlebar: Title bar
  titlebar_custom: Drawn by rudbgen
  titlebar_system: Drawn by the system

  language: Interface language
  language_hint: Menus and dialogs are re-drawn in the chosen language as soon as the settings are saved.

  # The default of the overwrite policy (architecture document, D11). The
  # three answers are the three variants of `OverwritePolicy`.
  overwrite_policy: When a file already exists
  overwrite_overwrite: Overwrite
  overwrite_skip: Skip
  overwrite_ask: Ask
  overwrite_hint: Where a run starts; the Generate tab can still choose differently for one run.

  jvm_heap: Java heap
  jvm_heap_hint: MB — the -Xmx a driver runs under
  jvm_args: Extra arguments
  jvm_hint: The heap is what a JDBC driver and the metadata reader run under. Both settings take effect the next time rudbgen starts. Extra arguments are separated by spaces.

  # The row of buttons under each theme picker.
  manage:
    duplicate: Duplicate…
    edit: Edit…
    delete: Delete
    # Both open a platform file dialog, hence the ellipsis.
    import: Import…
    export: Export…
    # Confirmation button of the file dialog the import opens.
    import_select: Import
    # Nothing could be read: the file is missing, unreadable, or not JSON at
    # all. The error comes from the reader and is not translated.
    import_unreadable: "“%{file}” could not be read: %{error}"
    # It is a theme file — of the other kind. The two formats look alike enough
    # that picking the wrong row is the mistake most easily made, so the message
    # says which row would have taken it.
    import_not_a_theme: "“%{file}” is an editor theme. Import it under Editor theme."
    import_not_an_editor_theme: "“%{file}” is an interface theme. Import it under Interface theme."
    # The right kind of file, with a colour in it that is not #RRGGBB.
    import_bad_color: "“%{file}” has no usable colour for %{slot}."
    # Some of the chosen files were installed and some were not. Only the ones
    # that failed are counted; the ones that worked are already in the picker.
    import_skipped: "%{count} files were skipped."
    # Name given to the copy. Has to carry the original's name, or duplicating
    # twice would produce two entries that read identically.
    copy_name: "%{name} (copy)"
    delete_theme_confirm: "Delete the theme “%{name}”?"
    delete_editor_theme_confirm: "Delete the editor theme “%{name}”?"
    write_failed: "The file could not be written: %{error}"
    delete_failed: "The file could not be removed: %{error}"

  # The colour editor the management row opens.
  editor:
    theme_title: Edit interface theme
    editor_theme_title: Edit editor theme
    name: Name
    dark: This is a dark palette
    invalid: "Every colour has to be written as #RRGGBB."
    # The five grid colours a theme file may leave out. The table inspector and
    # the custom-query test result are drawn with them.
    grid_group: Result grid — left out of the file unless a colour is given
    automatic: Automatic
    # How an automatic slot's own label reads while it is being derived.
    automatic_slot: "%{name} (automatic)"

    # The eleven required slots of an interface theme, plus the five grid ones.
    slot:
      background: Window
      surface: Panels
      surface_hover: Hovered
      surface_active: Pressed
      border: Separators
      text: Text
      text_muted: Muted text
      accent: Accent
      danger: Errors
      success: Success
      overlay: Dialog backdrop
      grid_header: Grid header
      grid_row_alt: Alternate row
      grid_selection: Grid selection
      grid_null: NULL marker
      grid_pk: Primary key

    # The nineteen slots of an editor theme. `background` is shared with the
    # list above; the rest name what the template and SQL highlighters hand out.
    code:
      foreground: Text
      cursor: Caret
      selection: Selection
      line_highlight: Current line
      gutter: Line numbers
      gutter_active: Current line number
      keyword: Keywords
      string: Strings
      number: Numbers
      comment: Comments
      function: Functions
      type: Type names
      operator: Operators
      identifier: Identifiers
      punctuation: Punctuation
      bracket_match: Matching bracket
      error: Errors
      warning: Warnings

# The update dialog, in all of its states: the announcement the start-up check
# puts up when GitHub has a newer release than the running build, the manual
# check from the menu, and the download that installs it. Both version numbers
# are values, not words, and the name `rudbgen` is not translated either.
update:
  title: Update available
  available: "rudbgen %{version} is available."
  # Second line, quieter than the first: which build the user is looking at
  # right now, so the offer means something without them going to the about box.
  installed: "You are currently running %{version}."
  # Downloads the release built for this platform and restarts into it. Falls
  # back to opening the release page where the project publishes no such build.
  update: Update
  # Never mention *this* release again. A later one still announces itself, so
  # the wording has to name the version rather than promise silence in general.
  ignore: Ignore this version
  # A check the user asked for, before the answer arrives. The start-up check
  # shows nothing at all until it has one.
  checking: Checking for updates…
  # The answer no other path ever shows: the start-up check stays silent here.
  up_to_date: You are up to date.
  # The two halves of an install, shown above the progress bar.
  downloading: Downloading…
  installing: Installing…
  # Heading of the error state. The detail printed underneath it comes from the
  # operating system, from `tar`, or from the server, and is not translated.
  failed: The update failed.
  # The way out of the error state, and of a release with no build for this
  # platform: the browser, and the user takes it from there.
  open_release: Open the release page
