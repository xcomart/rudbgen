# Build, lint and test on every platform rudbgen ships on.
#
# Inherited from rudbman, whose notes still hold for what is here today — russh
# is pinned to the `ring` backend so no NASM is needed anywhere, the OS-keychain
# tests are `#[ignore]`d, and gpui comes from a pinned revision of Zed's
# monorepo with the four crates patched on top of it under vendor/, so the only
# network the build needs is crates.io plus that one git fetch.
#
# Two things rudbman's workflow has that this one does not have *yet*:
#
#   * the JDK/Gradle steps that build `bridge/` and hand the H2 driver to the
#     JNI tests through an environment variable. `rudbgen-jdbc` and the trimmed
#     bridge arrive in M2 (architecture document, §10), and until then nothing
#     in the workspace boots a JVM, so a JDK on the runner would only be a
#     cache to warm.
#   * the opt-in `containers` job. It exists there to prove what five real
#     servers do with the SQL `rudbman-sql` writes; rudbgen writes no SQL to a
#     server, and the metadata reads it does make arrive with M2. The job comes
#     back then, against the same `docker/compose.yml` ports.
#
# Both are M2 work. Adding them earlier would mean a red matrix on a workspace
# that has nothing for them to test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Native libraries gpui links against on Linux. The crate graph binds
      # xkbcommon (+ its X11 half), wayland-client and fontconfig; fontconfig's
      # dev package pulls in the freetype headers that freetype-sys wants.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Formatting is platform-independent; checking it once is enough.
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked
