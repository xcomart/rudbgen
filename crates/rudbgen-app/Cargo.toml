[package]
name = "rudbgen-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The rudbgen binary: the window, the welcome screen, the settings and update dialogs"
build = "build.rs"

[[bin]]
name = "rudbgen"
path = "src/main.rs"

# Embeds assets/icon.ico into the Windows executable. gpui loads icon
# resource ID 1 for the window class, so one embedded icon covers Explorer,
# the taskbar and the window itself. That file is generated from
# `assets/icon.svg`; see `assets/README.md`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dependencies]
rudbgen-core.workspace = true
# The session behind a connection: `Jvm::start`, `Session::open` and the
# `EXECUTE` the custom-query test runs. `src/connection.rs` is the only module
# that opens one, and `src/driver_manager.rs` reaches the same JVM for
# `probe_drivers`.
rudbgen-jdbc.workspace = true
# The table model behind the explorer tree and the inspector: `MetaReader`
# turns `DESCRIBE` and the four custom queries into schemas, table lists and
# whole tables. Every call it offers blocks, so every call site is on a
# background task holding a `SessionHandle`.
rudbgen-meta.workspace = true
# The inspector's Columns tab. The grid is the one widget in the tree that
# already lays a header, resizable columns and a virtualised body out, and a
# column list is exactly what it draws.
ruui-grid.workspace = true
# The generation job behind the Generate tab: `Plan`, `generate`, `dry_run` and
# `preview`. It knows nothing of gpui by design, so the shell is what puts the
# run on a background thread, pumps its `Progress` into the progress dialog and
# answers its overwrite question from a modal.
rudbgen-gen.workspace = true
# The template tab's buffer (M4): `EditorView` under `src/template_syntax.rs`'s
# template highlighter, composed over the base language the file's extension
# names, and the same widget read-only for the live preview and the Preview tab.
ruui-editor.workspace = true
# The engine itself, for the two things the app does with a template that the
# generation job does not: parsing the buffer for the diagnostics list, and
# rendering the output-name template for the live preview's header.
rudbgen-template.workspace = true
# The one-time import of a jdbgen `config.json` (D5), behind the welcome
# screen's *Import from jdbgen…*: it locates the file, reads it, decrypts the
# three encrypted fields with jdbgen's own two schemes and maps the result onto
# rudbgen's stores. It writes nothing — `src/import_dialog.rs` is what folds
# what it produced into the four JSON files and the keychain.
rudbgen-import.workspace = true
# Local port forwarding through a bastion, for the connection dialog's tunnel
# block. Set up before the session opens and taken down after it closes; see
# `src/connection.rs`.
rudbgen-ssh.workspace = true
# The widget kit everything here is drawn with: the palettes and their file
# store, the text field, the buttons, tabs, menus, selects, trees and modals.
ruui.workspace = true
# The layer above the widgets, and the reason this crate no longer carries a
# `caption.rs`, an `update.rs` or a theme editor of its own: the window chrome,
# the self-updater and its dialog, the about box, the palette catalogues and
# their editor, the split-pane tree, the context-menu rows and the pieces a
# settings form is built out of. Everything it needs to know about rudbgen — the
# name, the version, the release endpoints, the words and where the ignored
# release tag is kept — is injected by `main` at start-up.
ruui-shell.workspace = true

# The tunnel registry in `src/connection.rs` is a process-wide map reached from
# background threads, and a panic while a tunnel is being opened must not make
# every other one unreachable — which is what `std`'s poisoning would do.
parking_lot.workspace = true
# `rudbgen-ssh`'s `HostKeyVerifier` is an async trait, and `src/connection.rs`
# implements it for the verifier that reads `known_hosts`.
async-trait.workspace = true

# The jdbgen import and the connection store both read JSON documents that
# nothing in `rudbgen-core` owns.
serde_json.workspace = true
# A generated template file and a fresh connection profile are both named after
# a UUID, so two of them cannot collide.
uuid.workspace = true
# The generation run and the driver download report their progress back over a
# channel, which is what lets a bar move while the work is on a background
# thread.
futures.workspace = true
# `rudbgen-core`'s settings and the theme directories both report their file
# errors as `anyhow::Result`.
anyhow.workspace = true
# The jdbgen import and the output directory picker both fall back to the user's
# home directory; `rudbgen-core` resolves the configuration directory but has no
# reason to expose the home one.
directories.workspace = true
gpui.workspace = true
# One call, in `main`: `gpui_platform::application()`. gpui's core no longer
# knows which windowing backend exists, so the façade is what links one in and
# hands back the `Application` the rest of `main` drives.
gpui_platform.workspace = true
log.workspace = true
env_logger.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
# One caller — `src/maven.rs`, the driver downloader, which asks Maven Central
# for a coordinate and then fetches the jar it names. gpui's own
# `cx.http_client()` is a `NullHttpClient` unless the application installs one,
# and installing a real one to serve one background request would be a much
# larger dependency. See the note beside the entry in the workspace manifest.
ureq.workspace = true
# One use, in `src/import_dialog.rs`: the buffer the jdbgen master password is
# moved into for the one call that needs it, so that it is wiped rather than
# left in a freed allocation once the configuration is open.
zeroize.workspace = true

[dev-dependencies]
# gpui's headless test platform, for the behaviour that only exists once an
# element tree has been laid out. Test-only: the binary links gpui without it.
gpui = { workspace = true, features = ["test-support"] }
# The window-geometry round trip writes a real `settings.json` and reads it
# back, rather than mocking the configuration directory out.
tempfile.workspace = true
