    else: Was geschrieben wird, wenn kein Zweig galt
    endif: Beendet ein if
    for: Schreibt seinen Rumpf einmal je Element einer Sammlung
    endfor: Beendet ein for
    date: Heute, geschrieben so, wie format es sagt
    user: Das Konto, unter dem der Generator läuft
    author: Das Feld Autor im Generieren-Tab
    inStr: Text zwischen zwei Durchläufen, nie vor dem ersten oder nach dem letzten
    indent: Leerzeichen, die zur Einrückung von inStr hinzukommen; darf negativ sein
    skipList: Namen zu überspringender Elemente, durch Kommas getrennt und genau verglichen
  dec:
    abbr: Wendet die Abkürzungsregeln auf den Wert an
    suffix: Wirft alles bis zum ersten Unterstrich weg, aus T_SAMPLE_ALBUM wird SAMPLE_ALBUM
    prefix: Wirft alles ab dem letzten Unterstrich weg, aus SAMPLE_ALBUM_T wird SAMPLE_ALBUM
    camel: Camel Case, aus SAMPLE_ALBUM wird sampleAlbum
    pascal: Pascal Case, aus SAMPLE_ALBUM wird SampleAlbum
    snake: Snake Case, aus SAMPLE_ALBUM wird sample_album
    screaming: Großgeschriebenes Snake Case, aus sampleAlbum wird SAMPLE_ALBUM
    skewer: Kebab Case, aus SAMPLE_ALBUM wird sample-album
    kebab: Ein anderer Name für skewer
    lower: Kleinbuchstaben
    upper: Großbuchstaben
    replace: replace('von','nach') ersetzt jedes Vorkommen
    padSize: Füllt den Wert mit Leerzeichen bis auf diese Breite
    padDir: Auf welcher Seite gefüllt wird, left oder right; rechts als Vorgabe
    quote: Umschließt den Wert an beiden Enden mit diesem Text
    prepend: Schreibt diesen Text vor den Wert
    postpend: Schreibt diesen Text hinter den Wert
  cond:
    equals: Gilt, wenn der Wert dies ist, ohne auf Groß und Klein zu achten
    notEquals: Gilt, wenn der Wert alles andere als dies ist
    startsWith: Gilt, wenn der Wert damit beginnt, ohne auf Groß und Klein zu achten
    notStartsWith: Gilt, wenn der Wert nicht damit beginnt
    endsWith: Gilt, wenn der Wert damit endet, ohne auf Groß und Klein zu achten
    notEndsWith: Gilt, wenn der Wert nicht damit endet
    contains: Gilt, wenn eine Sammlung ein Element dieses Namens hat oder eine Liste mit Kommas diesen Wert
    notContains: Gilt, wenn weder das eine noch das andere zutrifft
    matches: Gilt, wenn der ganze Wert auf diesen regulären Ausdruck passt; hier zählt Groß und Klein
    notMatches: Gilt, wenn der ganze Wert nicht darauf passt
  opt:
    key: Das Feld, das diese Anweisung schreibt, mitsamt Dekoratoren
    item: Ein anderer Name für key
    format: Wie das Datum geschrieben wird, in Javas Musterbuchstaben wie yyyy-MM-dd

