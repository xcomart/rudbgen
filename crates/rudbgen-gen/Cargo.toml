[package]
name = "rudbgen-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "the generation job: plan, render, write (architecture.md §9)"

[dependencies]
# The three crates this one is allowed to know (architecture.md §3):
#
# * `rudbgen-meta` is what a template is rendered against — the tables arrive
#   here already loaded, because reading them needs a JDBC session and this
#   crate must stay runnable without a JVM,
# * `rudbgen-template` parses and renders both the body and the output name,
# * `rudbgen-core` holds the saved generation profile a plan is built from, the
#   overwrite policy, and `paths::write_atomic`, which is the write this crate
#   does not reimplement.
#
# `gpui` is not among them and must never be: a generation run is driven from a
# background thread and every rule of §9 is testable in a temporary directory.
rudbgen-core.workspace = true
rudbgen-meta.workspace = true
# Not in `[workspace.dependencies]`: `rudbgen-template` is written to build on
# its own (see its manifest), so its consumers name the path.
rudbgen-template = { path = "../rudbgen-template" }

log.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
