# Interface strings, compiled into the binary by `rust_i18n::i18n!` in
# `src/main.rs`. This file is the source of truth: every other locale mirrors
# its keys, and a key missing from a translation falls back to the value here.
#
# Not translated anywhere, on purpose: the "rudbgen" and "jdbgen" wordmarks
# themselves, element ids, gpui key names, theme ids, the licence identifier,
# and the `Cmd`/`Ctrl` modifier names.
#
# This is the M0 set: the application shell and nothing that is not on screen
# yet. The connection dialog, the explorer tree, the Generate tab and the
# template editor bring their own namespaces as they arrive.
_version: 1

# What this language calls itself, for the settings dialog's language list.
# Written in the language of this file and never translated into another one:
# a user who has landed in a language they cannot read has to be able to find
# their own in the list. Every locale file must define it — the list of shipped
# languages is derived from these files, and this key is what names each entry.
language:
  name: English

# Shared by more than one dialog.
common:
  cancel: Cancel
  save: Save
  close: Close

# The explorer: the tree of tables down the left, and the ticks that say which
# of them the generator will be run over.
explorer:
  title: Explorer
  # The filter box over the tree; jdbgen's rule, which is contains, ignoring case.
  filter_placeholder: Filter tables
  show_views: Show views
  # The placeholder row under a schema whose tables are still on their way.
  loading: loading…
  # An error row whose message went missing. Only reachable through a bug, but a
  # blank row would be worse than a word.
  load_failed_unknown: This could not be loaded.

  # The right-click menu. "Shown" rather than "all": the three commands act on
  # the rows on screen, which is what the filter and the views toggle left.
  menu_select_shown: Select all shown
  menu_clear: Clear selection
  menu_invert: Invert selection
  menu_inspect: Open in inspector
  menu_refresh: Refresh

# The inspector: what one table is made of.
#
# Never translated: SQL keywords — NULL, NOT NULL, PK, UNIQUE, CASCADE, SET NULL
# — nor type names, which are the driver's own words and what the DDL says.
inspector:
  title: Inspector
  tab_columns: Columns
  tab_keys: Keys
  tab_foreign_keys: Foreign keys
  tab_indexes: Indexes
  # Nothing has been picked yet. The panel is on screen and empty rather than
  # absent, because it is where the answer will appear.
  empty: Pick a table to see what it is made of.
  # While the fetch for the table on screen is out.
  loading: loading…
  refresh: Refresh
  # A table that has none of whatever the tab lists — no indexes, no foreign keys
  # — as against one that could not be read.
  nothing_here: nothing here

  # Column headings.
  column: Column
  columns: Columns
  type: Type
  # Quoted: bare `Null` is YAML's null literal and would load as an empty
  # heading. The word is the SQL keyword and is not translated.
  nullable: "Null"
  default: Default
  key: Key
  comment: Comment
  name: Name
  seq: Position
  unique: Unique
  target: References
  source: Referenced by
  on_update: On update
  on_delete: On delete

  # Section headings, named by what they mean rather than by JDBC's "imported"
  # and "exported", which do not say which way the key points.
  references_out: Foreign keys of this table
  references_in: Foreign keys pointing at this table

connect:
  title: Connections
  # The list, and the profile being edited.
  new: New
  # Name a profile is created under. Replaced as soon as the user types.
  new_name: New connection
  duplicate: Duplicate
  delete: Delete
  delete_confirm: "Delete the connection “%{name}” and its saved password?"
  # Shown in the list for a profile the user has not named yet.
  unnamed: "(unnamed)"
  copy_name: "%{name} (copy)"

  name: Name
  folder: Folder
  color: Tag
  driver: Driver
  pick_driver: Choose a driver
  manage_drivers: Drivers…
  driver_has_no_jar: This driver has no JAR yet. Add or download one under Drivers.

  # The fields a driver's URL template is broken into. `database` heads whatever
  # the template calls it — a database, a service, a SID or a file — because the
  # question is the same one whatever the product names it.
  host: Host
  port: Port
  database: Database
  url: URL
  url_hint: Assembled from the fields above. Editing it directly keeps what you type.
  url_overridden: Typed by hand; the fields above no longer change it.
  url_reset: Rebuild

  username: User
  password: Password
  props: Driver properties
  prop_key: property
  prop_value: value
  add_prop: Add a property

  section:
    behaviour: Behaviour
    tunnel: SSH tunnel

  read_only: Open the connection read-only
  auto_commit: Commit each statement as it runs
  confirm_writes: Ask before running a write statement
  keep_alive: Keep the connection alive with a periodic query

  # The tunnel block. A production database usually sits behind a bastion host;
  # rudbgen forwards a local port through it and points JDBC at that port.
  tunnel_enabled: Connect through an SSH bastion
  tunnel_host: Bastion
  tunnel_user: Bastion user
  tunnel_auth: Authentication
  tunnel_auth_agent: SSH agent
  tunnel_auth_key: Private key
  tunnel_auth_password: Password
  tunnel_key: Key file
  tunnel_password: Bastion password
  tunnel_passphrase: Key passphrase
  tunnel_remote: Database
  tunnel_hint: The database is named as the bastion sees it. rudbgen binds a free local port and connects the driver to that.

  # The buttons along the bottom, and what they report.
  test: Test
  testing: Connecting…
  test_ok: "Connected to %{product}."
  # The driver answered nothing useful about the product, but the session opened
  # and answered a PING.
  test_ok_unnamed: The connection works.
  test_failed: "Could not connect: %{error}"
  test_failed_hint: "Could not connect: %{error} — %{hint}"
  connect: Connect
  saved: Saved.

  name_required: Give the connection a name.
  url_required: The connection has no URL.
  no_driver: "No driver definition named “%{driver}”."
  load_failed: "The saved connections could not be read: %{error}"
  save_failed: "The connections could not be saved: %{error}"
  keychain_failed: "The password could not be saved to the keychain: %{error}"

  # One-line suggestions attached to a failure whose SQLSTATE class says what
  # kind it is.
  hint_auth: check the user name and password
  hint_driver: check the driver JAR and the driver class
  hint_jvm: rudbgen needs a Java runtime; set RUDBGEN_JAVA_HOME or JAVA_HOME
  hint_network: check the host, the port and whether the database is reachable
  hint_host_key: the bastion's host key is not trusted yet

  # Trust on first use. The fingerprint is shown in full because comparing it
  # against what the machine's administrator published is the whole point;
  # neither it nor the algorithm name is translated.
  host_key_question: "%{host} presented an unknown %{algorithm} key: %{fingerprint}"
  trust_host_key: Trust this key
  host_key_trusted: The host key was added to the trusted list. Try connecting again.

  # What the welcome screen and the status bar say when an attempt did not
  # get through. The reason underneath comes from the driver, the bastion or
  # the JVM and is not translated.
  could_not_open: "%{name} could not be opened."
  tunnel_ended: "The SSH tunnel ended: %{reason}"

driver:
  title: Drivers
  name: Name
  class: Driver class
  class_hint: The fully qualified class name, as the driver's own documentation gives it — for example org.postgresql.Driver.
  # Reads the class out of the registered JARs instead of making the user find
  # it. The first probe of a session starts the Java runtime, so it can take a
  # few seconds.
  detect: Detect
  detecting: Looking inside the JAR files…
  probe_found: "Found %{class}."
  # More than one java.sql.Driver in the archive. The vendor's own
  # META-INF/services declaration is marked and preselected; the rest are
  # usually internal or deprecated drivers.
  probe_choose: This driver offers several classes. Pick the one to connect with.
  probe_recommended: recommended
  # A perfectly good archive with no driver in it, which is what a sources or
  # javadoc JAR looks like — the mistake that is actually made.
  probe_none: These files hold no JDBC driver. A sources or javadoc JAR looks like this; check that the right file was picked.
  # The archive started reading and then failed, which means the bytes are bad
  # rather than the file being the wrong one.
  probe_damaged: "The file is damaged and could not be read to the end; download it again. (%{error})"
  probe_missing: "The JAR file could not be found: %{error}"
  probe_jvm_failed: "The Java runtime could not be started: %{error}"
  probe_failed: "The JAR files could not be examined: %{error}"
  url_template: URL template
  default_port: Default port
  dialect: Dialect
  maven: Maven coordinate
  jars: JAR files
  add_jar: Add a JAR…
  # Confirmation button of the file dialog the button above opens.
  add_jar_select: Add
  remove_jar: Remove
  jar_missing: missing
  no_jar: no JAR
  no_jar_hint: A driver needs at least one JAR before a connection can use it.
  jar_count: "%{count} JAR(s)"
  download: Download
  downloading: "Downloading %{file}…"
  downloading_percent: "Downloading %{file} — %{percent}%"
  downloaded: "%{file} was downloaded and added."
  download_cancelled: The download was cancelled.
  bad_coordinate: "“%{coordinate}” is not a group:artifact:version coordinate."
  not_found: "Maven Central has nothing at %{url}."
  network_failed: "The download failed: %{error}"
  # The bytes that arrived do not hash to what Maven Central published beside
  # them, which means the transfer was corrupted.
  checksum_failed: "The download is corrupted: expected SHA-1 %{expected}, got %{actual}."
  load_failed: "The driver definitions could not be read: %{error}"
  save_failed: "The driver definitions could not be saved: %{error}"
  new: New
  new_name: New driver
  delete: Delete
  delete_confirm: "Delete the driver definition “%{name}”?"
  none_selected: Select a driver, or add one.

  # jdbgen calls it noAuth. The connection form then leaves the two credential rows out rather than greying them: there is no question to answer.
  no_auth: This product has no user and no password

# The four per-driver SQL overrides of the driver editor (architecture
# document, D9), and the Test button that runs one and checks what came back.
#
# Never translated: the column names of the contract, the ${catalog},
# ${schema} and ${table} holes, and the statements themselves.
custom_query:
  section: Custom queries
  section_hint: SQL for what this driver reports badly, or not at all. Inherited from jdbgen; a statement is sent only while its box is ticked.
  # Heads the three little fields the test substitutes the holes from.
  test_values: "Test with"
  tables: Table list
  columns: Column list
  table_comments: Table comments
  column_comments: Column comments
  test: Test
  testing: Running…
  ok: "OK — %{rows} rows, and every column the reader needs is there."
  missing: "Missing columns: %{labels}"
  wrong_columns: "The first %{expected} columns are read; only %{actual} came back."
  failed: "The statement failed: %{error}"
  empty: There is no statement to test.
  no_session: Connect to a database that uses this driver first — the test runs the statement on that session.
  contract_labels: "Must return these columns, by name: %{labels}"
  contract_positional: "The first %{columns} columns are read, in this order: %{names}"
  pair_table: table name, comment
  pair_column: column name, comment
  placeholders: "Filled in before the statement runs: %{names}"

# The in-app dropdown menu, and the macOS menu bar below it. The two differ
# only in capitalisation in English, but a translation may need to distinguish
# them, so they are separate keys.
#
# An ellipsis marks a row that asks something before it acts, which is every
# row here except "About" and "Quit".
menu:
  new_connection: New connection…
  settings: Settings…
  # Shows and hides the explorer sidebar, which only a connection puts on
  # screen; greyed until then.
  toggle_explorer: Explorer
  # Shows and hides the inspector panel, the explorer's opposite number.
  toggle_inspector: Inspector
  about: About rudbgen
  # Both the in-app row and the macOS menu-bar item, and also the title of the
  # dialog it opens — so no trailing ellipsis, which would read oddly as a
  # heading.
  check_updates: Check for updates
  quit: Quit
  # Name of the macOS menu bar's second menu, the one holding the commands that
  # act on connections.
  connection: Connection
  # Name of its third, holding what changes the layout of the window.
  view: View
  # Name of the menu holding the template tab's own commands, and the four
  # rows in it. Every one of them acts on the template that is on top, so all
  # but the first are greyed while no template tab is.
  template: Template
  open_template: Open template…
  save_template: Save template
  toggle_live_preview: Live preview
  trigger_completion: Suggest
  preview: Preview
  dry_run: Dry run
  generate: Generate
  generate_menu: Generate
  # Opens the abbreviation rules editor, the Generate tab's "Rules…" by another
  # door.
  abbreviations: Abbreviation rules…
  # The one-time import (D5). Never greyed: a configuration copied from another
  # machine is chosen from inside the wizard.
  import_jdbgen: Import from jdbgen…
  # Hover label of the button that opens the in-app menu.
  tip_menu: Menu
  mac:
    new_connection: New Connection…
    quit: Quit rudbgen

# The title bar: the connection selector and the two buttons beside it.
# The selector reads `no_connection` until a session is open, which in M0 is
# always.
titlebar:
  no_connection: No connection
  # The row that closes the session rather than opening one, on the end of
  # the list while one is open, and what the trigger reads while a session is
  # still opening.
  disconnect: Disconnect
  connecting: "%{name} — connecting…"
  tip_menu: Menu

# The welcome screen: the whole body of the window while no connection is
# open. The name, what the application is for, the three ways in, and the
# connections already saved.
welcome:
  # The line under the application's name.
  tagline: Point it at a database, pick tables and templates, and it writes the code.
  # Shown under the buttons once something is saved. `%{shortcut}` is "Cmd+N"
  # or "Ctrl+N"; neither is translated.
  hint: Press %{shortcut} to open a new connection.
  # The three buttons. Each takes the ellipsis for the same reason the menu
  # rows do: they ask before they act.
  new_connection: New connection…
  import_jdbgen: Import from jdbgen…
  open_template: Open a template…
  # Heading of the saved list, and what stands in its place on a first run.
  saved: Saved connections
  empty: No connections saved yet.

# The bar along the bottom. It reports the connection and the arithmetic of
# the run — tables × templates → files — and in M0 there is neither.
statusbar:
  no_connection: no connection
  no_selection: nothing to generate
  # The first half of §4.2's arithmetic; the templates and the file count join
  # it with the Generate tab. Quoted, so the leading interpolation cannot be
  # read as YAML's own syntax.
  tables_selected: "%{count} tables selected"
  run: "%{tables} tables · %{templates} templates → %{files} files into %{dir}"
  run_nowhere: "%{tables} tables · %{templates} templates → %{files} files, no output directory yet"
  # The three states of the left cell once a connection has been asked for.
  # `%{product}` is what SESSION_INFO named, which is a value and not a word.
  connecting: "connecting to %{name}…"
  connected: "%{name} · %{product}"
  failed: "%{name} — not connected"
  unknown_product: unknown product

# The Generate tab (§4.4): the template set, the template list and the
# options. The template *names* are not here — they are the user's, saved in
# `connections.json`, and a label that changed with the interface language
# would leave a profile carrying a name from whichever language it was saved
# in.
generate:
  # What the permanent tab is called on the strip.
  tab: Generate
  template_set: Template set
  # Shown while the list matches no saved set (§4.4).
  set_custom: Custom
  save_as_set: Save as set…
  delete_set: Delete set
  delete_set_confirm: "Delete the template set “%{name}”?"
  set_name: Name
  templates: Templates
  no_templates: No templates yet — add one, and the run has something to write.
  add_template: Add template…
  add_template_select: Choose template files
  template_name: name
  out_template: output name
  tip_edit: Edit the template
  tip_open: Double click to open the template
  tip_remove: Remove from the list
  options: Options
  output_dir: Output
  output_placeholder: where the generated files go
  output_select: Choose the output directory
  # The `...` chooser beside the output field. Quoted: a bare ellipsis is
  # punctuation, not a word, and YAML would be within its rights to read it
  # as something else.
  browse: "…"
  author: Author
  author_placeholder: the value every template's author item reads
  variables: Variables
  var_key: name
  var_value: value
  apply_abbreviations: Apply abbreviation rules
  rules: Rules…
  preview: Preview
  dry_run: Dry run
  run: Generate
  preview_table: Table
  preview_template: Template
  preview_empty: Nothing rendered yet.
  dry_exists: replaces
  dry_new: new
  dry_bytes: "%{bytes} B"
  diagnostics: "%{count} warnings"
  at_line: "line %{line}"
  # A table the run could not describe. `%{reason}` is the driver's own
  # words and is not translated.
  read_failed: "%{table} could not be read: %{reason}"
  # The four reasons the Generate button is greyed, in the order §4.2 checks
  # them: the tooltip names the first thing missing, not all four.
  blocked_connection: Open a connection first.
  blocked_tables: Tick at least one table in the explorer.
  blocked_templates: Tick at least one template.
  blocked_output: Choose an output directory first.
  blocked_running: A run is already going.

# The progress dialog of a run (D11). Every line here is one row of its log,
# so they are worded as a log is: lower case, no full stop.
progress:
  title: Generating…
  started: "starting on %{count} files"
  parsed: "%{count} templates parsed"
  read_table: "read %{table}"
  written: "wrote %{path}"
  skipped: "kept %{path}"
  failed: "%{path} failed: %{reason}"
  conflict: "%{path} is already there"
  cancelling: cancelling…
  count: "%{done} of %{total}"

# The result summary, and the overwrite question a run under the *ask* policy
# stops on.
summary:
  title: Result
  done: Everything the run asked for was written.
  with_failures: The run finished with failures.
  cancelled: The run was cancelled; what it had written is below.
  counts: "%{written} written · %{skipped} skipped · %{failed} failed · %{warnings} warnings"
  written: Written
  skipped: Skipped
  failed: Failed
  open_output: Open output directory
  conflict_title: The file is already there
  conflict_body: Replace it, keep it, or answer for the rest of the run at once.
  overwrite: Overwrite
  skip: Skip
  overwrite_all: Overwrite all
  skip_all: Skip all

# The about box. The version, the licence name and the names of the libraries
# are values, not words, and are never translated.
about:
  title: About rudbgen
  version: "Version %{version}"
  tagline: A database code generator that renders jdbgen's templates in Rust and draws its interface with gpui.
  license: "Licensed under %{license}."
  credits: Built with gpui (vendored and patched).

# The settings dialog and the theme editor inside it.
#
# Never translated: hex colour values, the `#RRGGBB` notation, JVM flags and
# the slot keys of a theme file. The slot *labels* below are translated — they
# name what a colour is for, not what the file calls it.
settings:
  title: Settings
  # Heads both dropdowns, and doubles as their placeholder so a trigger reads
  # the same whether or not its list is open.
  system_default: Use the system setting
  save_failed: "The settings could not be saved: %{error}"

  section:
    appearance: Appearance
    window: Window
    language: Language
    generation: Generation
    jvm: Java virtual machine

  ui_theme: Interface theme
  editor_theme: Editor theme
  editor_follows_ui: Match the editor theme to the interface theme
  ui_font_size: Interface size
  editor_font: Editor font
  editor_font_size: Editor size
  # Unit hint after a narrow field. A range, so it reads the same everywhere.
  font_size_hint: 6 – 32 pt

  opacity: Opacity
  opacity_hint: "% — below 100 lets the desktop show through"
  blur: Blur the desktop behind the window
  titlebar: Title bar
  titlebar_custom: Drawn by rudbgen
  titlebar_system: Drawn by the system

  language: Interface language
  language_hint: Menus and dialogs are re-drawn in the chosen language as soon as the settings are saved.

  # The default of the overwrite policy (architecture document, D11). The
  # three answers are the three variants of `OverwritePolicy`.
  overwrite_policy: When a file already exists
  overwrite_overwrite: Overwrite
  overwrite_skip: Skip
  overwrite_ask: Ask
  overwrite_hint: Where a run starts; the Generate tab can still choose differently for one run.

  jvm_heap: Java heap
  jvm_heap_hint: MB — the -Xmx a driver runs under
  jvm_args: Extra arguments
  jvm_hint: The heap is what a JDBC driver and the metadata reader run under. Both settings take effect the next time rudbgen starts. Extra arguments are separated by spaces.

  # The row of buttons under each theme picker.
  manage:
    duplicate: Duplicate…
    edit: Edit…
    delete: Delete
    # Both open a platform file dialog, hence the ellipsis.
    import: Import…
    export: Export…
    # Confirmation button of the file dialog the import opens.
    import_select: Import
    # Nothing could be read: the file is missing, unreadable, or not JSON at
    # all. The error comes from the reader and is not translated.
    import_unreadable: "“%{file}” could not be read: %{error}"
    # It is a theme file — of the other kind. The two formats look alike enough
    # that picking the wrong row is the mistake most easily made, so the message
    # says which row would have taken it.
    import_not_a_theme: "“%{file}” is an editor theme. Import it under Editor theme."
    import_not_an_editor_theme: "“%{file}” is an interface theme. Import it under Interface theme."
    # The right kind of file, with a colour in it that is not #RRGGBB.
    import_bad_color: "“%{file}” has no usable colour for %{slot}."
    # Some of the chosen files were installed and some were not. Only the ones
    # that failed are counted; the ones that worked are already in the picker.
    import_skipped: "%{count} files were skipped."
    # Name given to the copy. Has to carry the original's name, or duplicating
    # twice would produce two entries that read identically.
    copy_name: "%{name} (copy)"
    delete_theme_confirm: "Delete the theme “%{name}”?"
    delete_editor_theme_confirm: "Delete the editor theme “%{name}”?"
    write_failed: "The file could not be written: %{error}"
    delete_failed: "The file could not be removed: %{error}"

  # The colour editor the management row opens.
  editor:
    theme_title: Edit interface theme
    editor_theme_title: Edit editor theme
    name: Name
    dark: This is a dark palette
    invalid: "Every colour has to be written as #RRGGBB."
    # The five grid colours a theme file may leave out. The table inspector and
    # the custom-query test result are drawn with them.
    grid_group: Result grid — left out of the file unless a colour is given
    automatic: Automatic
    # How an automatic slot's own label reads while it is being derived.
    automatic_slot: "%{name} (automatic)"

    # The eleven required slots of an interface theme, plus the five grid ones.
    slot:
      background: Window
      surface: Panels
      surface_hover: Hovered
      surface_active: Pressed
      border: Separators
      text: Text
      text_muted: Muted text
      accent: Accent
      danger: Errors
      success: Success
      overlay: Dialog backdrop
      grid_header: Grid header
      grid_row_alt: Alternate row
      grid_selection: Grid selection
      grid_null: NULL marker
      grid_pk: Primary key

    # The nineteen slots of an editor theme. `background` is shared with the
    # list above; the rest name what the template and SQL highlighters hand out.
    code:
      foreground: Text
      cursor: Caret
      selection: Selection
      line_highlight: Current line
      gutter: Line numbers
      gutter_active: Current line number
      keyword: Keywords
      string: Strings
      number: Numbers
      comment: Comments
      function: Functions
      type: Type names
      operator: Operators
      identifier: Identifiers
      punctuation: Punctuation
      bracket_match: Matching bracket
      error: Errors
      warning: Warnings

# The update dialog, in all of its states: the announcement the start-up check
# puts up when GitHub has a newer release than the running build, the manual
# check from the menu, and the download that installs it. Both version numbers
# are values, not words, and the name `rudbgen` is not translated either.
update:
  title: Update available
  available: "rudbgen %{version} is available."
  # Second line, quieter than the first: which build the user is looking at
  # right now, so the offer means something without them going to the about box.
  installed: "You are currently running %{version}."
  # Downloads the release built for this platform and restarts into it. Falls
  # back to opening the release page where the project publishes no such build.
  update: Update
  # Never mention *this* release again. A later one still announces itself, so
  # the wording has to name the version rather than promise silence in general.
  ignore: Ignore this version
  # A check the user asked for, before the answer arrives. The start-up check
  # shows nothing at all until it has one.
  checking: Checking for updates…
  # The answer no other path ever shows: the start-up check stays silent here.
  up_to_date: You are up to date.
  # The two halves of an install, shown above the progress bar.
  downloading: Downloading…
  installing: Installing…
  # Heading of the error state. The detail printed underneath it comes from the
  # operating system, from `tar`, or from the server, and is not translated.
  failed: The update failed.
  # The way out of the error state, and of a release with no build for this
  # platform: the browser, and the user takes it from there.
  open_release: Open the release page

# The template tab: the editor, the live preview beside it, and the question
# asked when one is closed with edits in it (§4.5).
template:
  # The marker in the tab's header strip while the buffer differs from the file.
  unsaved: unsaved
  tip_preview: Show or hide the live preview
  show_preview: Show preview
  hide_preview: Hide preview
  # Placeholder of the dropdown that picks which table the preview is of.
  preview_table: Table
  # What stands in the preview's place when it cannot be rendered. The first
  # two are situations rather than failures, so neither is worded as an error.
  preview_no_connection: Open a connection to see this template rendered against a table.
  preview_no_table: Tick a table in the explorer to see this template rendered.
  preview_parse_error: The template cannot be parsed; what is wrong is listed below.
  # The file could not be opened or written. `%{file}` is a path and
  # `%{reason}` the operating system's own words.
  read_failed: "%{file} could not be opened: %{reason}"
  write_failed: "%{file} could not be written: %{reason}"
  not_utf8: "%{file} is not UTF-8 text, so it cannot be edited here."
  # Title of the platform file picker the welcome screen and the menu open.
  open_select: Open a template
  # Closing a tab with unsaved edits. Three answers, because a close that only
  # offered two would be one nobody could take back.
  close_title: Unsaved changes
  close_question: "%{file} has changes that have not been saved yet."
  discard: Don't save

# The list under the editor: what the parser rejected, and what the render
# could not answer. Both are places in the file, so both are listed the same
# way and marked the same way in the gutter.
diagnostics:
  title: Problems (%{count})
  # One row's position: line and column, both counted from one.
  at: "%{line}:%{column}"

# The popup that offers what may be written where the caret is.
completion:
  # The footer under the list. The key names are not translated.
  hint: ↑↓ to choose · Enter to insert · Esc to dismiss
  # Shown in the footer when the list is longer than the popup.
  more: "%{count} more"

# The variable palette, which is what the inspector's column becomes while a
# template tab is on top. Every entry carries one line about what it does,
# summarised from jdbgen's template reference; they are documentation, and
# they are what the completion popup shows beside each suggestion too.
palette:
  title: Variables
  search: Filter variables
  no_match: Nothing matches.
  custom_var: A variable from the Generate tab's table.
  section_table: Table fields
  section_column: Column fields (inside a for)
  section_fk: Foreign key fields
  section_index: Index fields
  section_statement: Statements
  section_decorator: Decorators
  section_condition: Conditions
  section_custom: Custom variables
  table:
    catalog: The database catalog holding the table
    schema: The database schema holding the table
    name: The table name
    table: Another name for name
    title: Another name for name
    type: TABLE or VIEW
    remarks: The table comment
    columns: Every column, in the order the database reports them
    keys: The primary key columns, in key order
    notKeys: Every column that is not part of the primary key
    imports: The foreign keys this table declares
    exports: The foreign keys other tables declare on this one
    indexes: The indexes of this table
    icon: The icon the table list draws beside the table
    position: Where the table came in the list it was read from
  column:
    catalog: The database catalog holding the column
    schema: The database schema holding the column
    table: The table the column belongs to
    name: The column name
    column: Another name for name
    typeName: The type name the driver reports, such as VARCHAR or INT
    typeString: The type as DDL writes it, length and all, such as VARCHAR(256)
    isKey: Whether the column is part of the primary key
    isCharType: Whether the type is a CHAR, CLOB or TEXT
    length: "The column size: characters for text, digits for numbers"
    precision: How many digits a numeric column holds altogether
    scale: How many of those digits are after the decimal point
    nullable: 0 when the column is NOT NULL, 1 when it accepts one
    remarks: The column comment
    defVal: The default value
    dataType: The raw java.sql.Types code the driver reported
    jdbcType: The JDBC type name that code stands for
    javaType: The Java type name that code maps to
    autoIncrement: Whether the database fills the column in by itself
    keySeq: Where the column comes in the primary key, from 1
    fk: What the column points at, when exactly one foreign key uses it
    position: Where the column comes in the loop, from 1
  fk:
    name: The constraint name
    columns: The columns of this table the key is made of
    refCatalog: The catalog of the table at the other end
    refSchema: The schema of the table at the other end
    refTable: The table at the other end
    refColumns: Its columns, in the same order as this one's
    onUpdate: What an update to the row at the other end does
    onDelete: What a delete of the row at the other end does
    position: Where the key comes in the list, from 1
    catalog: Inside a column's fk — the catalog of the table it points at
    schema: Inside a column's fk — the schema of the table it points at
    table: Inside a column's fk — the table it points at
    column: Inside a column's fk — the column it points at
  index:
    name: The index name
    unique: Whether it is a unique index
    columns: Its columns, in index order
    position: Where the index comes in the list, from 1
  stmt:
    item: Writes a field of the model, with its decorators
    super: Reaches the table from inside a for loop
    if: Writes its body when the conditions hold; needs an endif
    elif: Another branch of the if above it
    else: What is written when no branch held
    endif: Ends an if
    for: Writes its body once per element of a collection
    endfor: Ends a for
    date: Today, written the way format says
    user: The account the generator is running as
    author: The Author field of the Generate tab
    inStr: Text written between iterations, never before the first or after the last
    indent: Spaces added to what inStr writes; may be negative
    skipList: Element names to skip, separated by commas and matched exactly
  dec:
    abbr: Applies the abbreviation rules to the value
    suffix: Drops everything up to the first underscore, so T_SAMPLE_ALBUM becomes SAMPLE_ALBUM
    prefix: Drops everything from the last underscore, so SAMPLE_ALBUM_T becomes SAMPLE_ALBUM
    camel: Camel case, so SAMPLE_ALBUM becomes sampleAlbum
    pascal: Pascal case, so SAMPLE_ALBUM becomes SampleAlbum
    snake: Snake case, so SAMPLE_ALBUM becomes sample_album
    screaming: Screaming snake case, so sampleAlbum becomes SAMPLE_ALBUM
    skewer: Skewer case, so SAMPLE_ALBUM becomes sample-album
    kebab: Another name for skewer
    lower: Lower case
    upper: Upper case
    replace: replace('from','to') rewrites every occurrence
    padSize: Pads the value with spaces up to this width
    padDir: Which side the padding goes on, left or right; right by default
    quote: Wraps the value in this text at both ends
    prepend: Writes this text in front of the value
    postpend: Writes this text after the value
  cond:
    equals: Holds when the value is this, whatever the case
    notEquals: Holds when the value is anything but this
    startsWith: Holds when the value starts with this, whatever the case
    notStartsWith: Holds when the value does not start with this
    endsWith: Holds when the value ends with this, whatever the case
    notEndsWith: Holds when the value does not end with this
    contains: Holds when a collection holds an element of this name, or a comma-separated list holds this value
    notContains: Holds when neither does
    matches: Holds when the whole value matches this regular expression; case matters here
    notMatches: Holds when the whole value does not match it
  opt:
    key: The field this statement writes, decorators and all
    item: Another name for key
    format: How the date is written, in Java's pattern letters such as yyyy-MM-dd

# The abbreviation rules editor (§4.6). One table over the one global
# `abbreviations.json`, opened from the Generate tab's "Rules…" and from the
# menu. The `apply` checkbox above it is the Generate tab's own switch, so its
# label lives under `generate.apply_abbreviations` and not here.
abbr:
  title: Abbreviation rules
  # The one line that says what a rule does, D10's change included. It is the
  # difference between a table people can fill in and a table people guess at.
  how_it_works: A whole-name rule replaces the entire identifier; otherwise the name is split at _ and -, and each word is looked up on its own. Both match whatever the case, which jdbgen did not do.
  column_apply: Apply
  column_whole: Whole name
  column_abbreviation: Abbreviation
  column_replacement: Replacement
  abbreviation_placeholder: what to look for
  replacement_placeholder: what to put in its place
  # The dropdown beside a whole-name row, offering the tables the explorer has
  # loaded. Only drawn while something is connected.
  pick_table: Table…
  tip_remove: Remove this rule
  # Why Save is greyed. `%{abbreviation}` is the user's own text.
  duplicate: "%{abbreviation}: two rules that are on look for this, and only one of them could ever fire."

# The one-time import of a jdbgen configuration (D5), in three steps: the file
# and the master password, the checklist, the result.
import:
  title: Import from jdbgen
  password_hint: jdbgen encrypts the connection URL, the user name and the password behind one master password. rudbgen asks for it once, here, and then puts the passwords in the keychain your operating system already guards.
  master_password: Master password
  password_placeholder: the password jdbgen asks for at start-up
  other_file: Other file…
  choose_file: Choose a jdbgen config.json
  opening: Opening the configuration…
  next: Next
  import: Import
  importing: Writing…
  section_connections: Connections
  section_drivers: Drivers
  section_sets: Template sets
  section_rules: Abbreviation rules
  section_settings: Settings
  section_conflicts: Names that are already taken
  section_notes: Worth knowing
  nothing_here: None in this file.
  rules_count: "Import %{count} rules"
  apply_abbr: Apply the rules to generated names
  set_templates: "%{count} templates"
  matches_builtin: "uses rudbgen's built-in %{builtin}"
  # The settings row. `%{language}` is a language tag such as ko, `%{theme}`
  # one of the two words below.
  adopt_settings: "Use jdbgen's language (%{language}) and its %{theme} theme"
  system_language: the system language
  theme_dark: dark
  theme_light: light
  conflict_rename: Keep both when a name is already taken
  conflict_rename_hint: What comes from jdbgen is added with "(imported)" after its name.
  conflict_skip_hint: What is already here is kept, and the jdbgen entry is left behind.
  written: "Imported %{connections} connections, %{drivers} drivers, %{sets} template sets and %{rules} abbreviation rules."
  nothing_written: Nothing was imported.
  skipped: "Left behind, because the name was taken: %{names}"
  no_keychain: "These connections were saved without their password, because it could not be put in the keychain: %{names}. Open one and it will ask."
  wrong_password: That is not the master password of this configuration.
  malformed: "This configuration is damaged: one of the encrypted values is not a value at all."
  unreadable: That file could not be read.
  not_jdbgen: That file is not a jdbgen configuration.
  # The notes the mapping produced, one line each.
  note_case_rule: Word abbreviation rules now match whatever the case. jdbgen only ever matched lower-case segments, so a rule that did nothing there may start firing here.
  note_legacy: Some values were written in jdbgen's older encryption format. They were read all the same, and your jdbgen configuration is left exactly as it was.
  note_stock_matched: "%{driver}: rudbgen's own %{builtin} definition is used, with your JAR, SQL overrides and properties."
  note_stock_unknown: "%{driver} (%{class}) matches none of rudbgen's definitions and is imported as a driver of its own."
  note_unknown_driver: "%{connection} names the driver %{driver}, which this configuration does not define. Pick one before connecting."
  note_keep_alive: "%{connection} has a keep-alive interval of %{value}, which is not a number of seconds. The probe is imported switched off."
  note_unresolved_path: "The %{kind} %{path} of %{owner} was in neither of jdbgen's directories. It is imported as it stands."
  note_icon: "The icon %{icon} of %{owner} has no equivalent here and is dropped."
  path_jar: driver JAR
  path_template: template file
  path_output: output directory
