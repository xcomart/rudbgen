# Build release archives for a version tag and attach them to a GitHub
# Release. Trigger with:
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# The build matrix only uploads artifacts; a single publish job creates the
# release afterwards. When each build job published directly, all three ran
# generate_release_notes and the release body carried the same changelog
# line three times.
#
# Inherited from rudbman. Every build job runs Gradle -> jlink -> cargo, in
# that order: rudbgen-jdbc's build script refuses to compile without
# bridge/build/libs/rudbgen-bridge.jar, and the archives ship a jlink runtime
# so users need no JDK of their own. What comes out is a tree, not a binary.
#
# The asset names are a contract with rugpui-shell's updater, which
# builds the name it downloads from the tag and its own target triple:
#
#   rudbgen-<tag>-<target>.zip      (windows)
#   rudbgen-<tag>-<target>.tar.gz   (linux, macos)
#
# and the Windows installer beside the zip is
# rudbgen-<tag>-<target>-setup.exe, which the winget job hands to
# wingetcreate. Renaming any of them breaks an updater that has already
# shipped.
#
# Before anything is built, `verify` refuses a tag that does not match the
# workspace version or that points at a commit `main` does not contain, and
# `test` runs the Linux test suite on the tagged commit; `publish` waits for
# both. Only `publish` can write to the repository. Next to the archives it
# uploads SHA256SUMS, one `sha256sum` line per asset.
#
# Third-party actions are pinned to a full commit SHA, with the release that
# SHA belongs to in a trailing comment; bump both together.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; the publish job asks for write access on its own.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same pin as ci.yml: the shipped binaries are built by the toolchain CI
  # tested with.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  # A tag is a promise about two things this job can check before an hour of
  # builds is spent on it: that it names the version the binaries will report
  # (the workspace `version`, which the updater compares against the tag), and
  # that it was cut from what was merged into `main`, as the release procedure
  # requires -- not from a `dev` commit that never got there.
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag matches the workspace version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (expected v$version)"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches the workspace version"

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not contained in origin/main; merge the release into main before tagging"
            exit 1
          fi
          echo "$GITHUB_SHA is contained in origin/main"

  # The tagged commit's test suite, once more, before anything is published:
  # CI ran it on the branch, but a tag can be pushed on any commit. Linux only,
  # mirroring the Linux leg of ci.yml -- the bridge's own suite first, because
  # rudbgen-jdbc's build script needs its JAR and the JNI tests need H2.
  test:
    name: test (linux)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: bridge/*.gradle

      - name: Build and test the bridge
        working-directory: bridge
        run: ./gradlew build --no-daemon

      - name: Locate the H2 driver
        run: |
          jar=$(find ~/.gradle/caches/modules-2/files-2.1/com.h2database -name 'h2-*.jar' | head -1)
          test -f "$jar"
          echo "RUDBGEN_TEST_H2_JAR=$jar" >> "$GITHUB_ENV"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: test
        run: cargo test --workspace --locked

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      # gpui_windows' build script compiles HLSL shaders with fxc.exe from
      # the Windows SDK. It looks on PATH and then at whatever the registry
      # records, so point it at the SDK the runner image actually carries.
      - name: Locate fxc.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw "fxc.exe not found in the Windows SDK" }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 17 is what the bridge compiles against (--release 17), so it is also
      # what the shipped runtime is jlinked from. Temurin because it exists for
      # all three runners and carries the jmods jlink needs.
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: bridge/*.gradle

      # Before cargo, always: rudbgen-jdbc's build script panics if the JAR is
      # missing. Only `jar` here — CI already ran the bridge's own suite on the
      # commit this tag points at.
      - name: Build the bridge JAR
        working-directory: bridge
        # bash on every runner: the Windows one has Git Bash, and this keeps
        # `./gradlew` meaning the same file on all three.
        shell: bash
        run: ./gradlew jar --no-daemon

      # The Java runtime that ships inside the archive. The module list is the
      # load-bearing part: a driver that reaches for a missing module fails at
      # connect time, not at build time, which is why the smoke step below
      # checks the result. jdk.unsupported covers drivers using sun.misc.Unsafe
      # and jdk.charsets covers the extended charsets a template written in a
      # legacy encoding is read and written through.
      #
      # `--compress=2` is JDK 17's spelling of maximum compression; the
      # `--compress=zip-N` form only exists from JDK 21 on.
      - name: Build the bundled Java runtime
        shell: bash
        run: |
          jlink --module-path "$JAVA_HOME/jmods" \
            --add-modules \
              java.base,java.sql,java.sql.rowset,java.naming,java.transaction.xa,java.security.jgss,java.security.sasl,java.management,java.logging,jdk.charsets,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.net \
            --strip-debug --no-header-files --no-man-pages --compress=2 \
            --output runtime

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --release --locked -p rudbgen-app --target ${{ matrix.target }}

      # The one JDBC driver the archive carries. A first run seeds a connection
      # to the sample H2 database (crates/rudbgen-app/src/sample_db.rs), and a
      # DriverDef with nothing on its class path fails with NoDriverJar before
      # it reaches JDBC — so without this the sample connection would need a
      # trip to Maven Central through the driver manager before it opened at
      # all. Every other driver still goes that way, because their licences do
      # not allow a third party to redistribute them; H2 is dual licensed under
      # MPL 2.0 and EPL 1.0, which do.
      #
      # The coordinate is the `h2-embedded` one from rudbgen-core's built-in
      # driver list, and the file name is what rudbgen looks for beside the
      # executable; sample_db's `the_bundled_jar_matches_the_builtin_coordinate`
      # is what fails when one of the three moves without the others.
      #
      # The digest is pinned rather than fetched: Central publishes a `.sha1`
      # beside every artefact, which is an integrity check against a truncated
      # transfer and nothing more, where a digest written down here also says
      # the release ships the bytes that were reviewed. It was taken from the
      # artefact at this URL and cross-checked against that published `.sha1`
      # (686180ad33981ad943fdc0ab381e619b2c2fdfe5).
      - name: Fetch the bundled H2 driver JAR
        shell: bash
        env:
          H2_JAR: h2-2.4.240.jar
          H2_URL: https://repo1.maven.org/maven2/com/h2database/h2/2.4.240/h2-2.4.240.jar
          H2_SHA256: 29b70e427cc1c40cdc376283adbb0cc62853073797bb5fe5761f81fe73d57ce0
        run: |
          mkdir -p drivers
          curl --fail --silent --show-error --location --retry 3 \
            --output "drivers/$H2_JAR" "$H2_URL"
          # sha256sum on Linux and in Git for Windows' bash; shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "drivers/$H2_JAR" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "drivers/$H2_JAR" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$H2_SHA256" ]; then
            echo "$H2_URL hashes to $actual, not $H2_SHA256"
            exit 1
          fi

      # A bare Mach-O binary cannot carry an icon; macOS wants an .app bundle
      # with an Info.plist and an .icns. The runtime and the bridge JAR both go
      # under Contents/, one level above the executable, which is the second
      # place the JVM loader looks for each (crates/rudbgen-jdbc/src/jvm.rs).
      # Not under Contents/MacOS/: everything there is nested code to codesign,
      # and sealing the bundle fails on an unsigned JAR.
      #
      # The bundle is ad-hoc signed (`codesign --sign -`): no Apple Developer
      # account, no secrets, and no identity in the signature. That is not
      # notarization and it does not satisfy Gatekeeper, so the first launch of
      # a downloaded copy still needs right-click -> Open. What it buys is one
      # signature over the bundle as a whole, sealing the Info.plist we just
      # wrote where the linker's own ad-hoc signature covers the executable
      # alone.
      #
      # --strict rather than --deep: the jlink runtime is a tree of Mach-O
      # files that arrive with signatures of their own, and a deep verify walks
      # into them and judges those instead of the seal this step just made.
      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="rudbgen.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/lib" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/rudbgen" "$app/Contents/MacOS/"
          cp bridge/build/libs/rudbgen-bridge.jar "$app/Contents/lib/"
          cp -R runtime "$app/Contents/runtime"
          cp assets/icon.icns "$app/Contents/Resources/rudbgen.icns"
          # templates/ is a reference copy: the three built-in templates are
          # compiled into the binary and written to the configuration directory
          # on first run. sample/ is read by the program — a first run with no
          # connections.json copies the H2 database out of Resources/sample into
          # the configuration directory, where H2 may open it read-write, and
          # seeds the connection that opens the copy. drivers/ is read by the
          # same first run: the H2 JAR is copied into the configuration and put
          # on the h2-embedded class path, so that connection opens offline.
          cp -R templates "$app/Contents/Resources/templates"
          cp -R assets/sample "$app/Contents/Resources/sample"
          cp -R drivers "$app/Contents/Resources/drivers"
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          staging="rudbgen-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$staging"
          cp -R "$app" README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      # Linux gets the flat tree plus a desktop entry, hicolor icons and a
      # per-user install script; install.sh puts everything under ~/.local.
      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          staging="rudbgen-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging/lib" "$staging/icons"
          cp "target/${{ matrix.target }}/release/rudbgen" "$staging/"
          cp bridge/build/libs/rudbgen-bridge.jar "$staging/lib/"
          cp -R runtime "$staging/runtime"
          cp -R templates "$staging/templates"
          cp -R assets/sample "$staging/sample"
          cp -R drivers "$staging/drivers"
          cp README.md packaging/linux/com.aihouse.rudbgen.desktop "$staging/"
          install -m755 packaging/linux/install.sh "$staging/install.sh"
          cp assets/icon-128.png "$staging/icons/rudbgen-128.png"
          cp assets/icon-256.png "$staging/icons/rudbgen-256.png"
          cp assets/icon.svg "$staging/icons/rudbgen.svg"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      # signtool.exe ships with the Windows SDK and is not on PATH, so it needs
      # the same treatment as fxc.exe above.
      - name: Locate signtool.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' }
          # Versioned SDK directories (bin\10.0.26100.0\x64) sort newest last;
          # the legacy unversioned bin\x64 copy is only a fallback because it
          # can predate the SDK actually installed on the image.
          $signtool = $candidates |
            Where-Object { $_.FullName -match '\\bin\\10\.[0-9.]+\\x64\\' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { $signtool = $candidates | Select-Object -First 1 }
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Authenticode-sign the exe with a self-signed certificate. The long form
      # of why — that this is a tamper seal and not a reputation, that
      # SmartScreen is unmoved by it, and why a missing secret has to skip
      # rather than fail — lives at the top of packaging/windows/sign.ps1,
      # because the installer built further down needs the identical treatment
      # and the retry-and-cleanup dance is not worth having twice.
      #
      # The secrets are still mapped into env here rather than tested in `if:`:
      # the `secrets` context is not available in step-level `if:` expressions,
      # so the "is a certificate configured" question can only be asked inside
      # the script.
      - name: Sign (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./packaging/windows/sign.ps1 "target/${{ matrix.target }}/release/rudbgen.exe"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "rudbgen-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory "$staging/lib" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rudbgen.exe" $staging
          Copy-Item "bridge/build/libs/rudbgen-bridge.jar" "$staging/lib/"
          Copy-Item runtime $staging -Recurse
          Copy-Item templates $staging -Recurse
          Copy-Item assets/sample $staging -Recurse
          Copy-Item drivers $staging -Recurse
          Copy-Item README.md $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STAGING=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The archive layout is a contract with code that has already shipped:
      # the JVM loader finds its runtime and the bridge JAR by walking relative
      # paths from the executable, and a module the jlink list forgot only
      # surfaces as a NoClassDefFoundError when a user opens a connection. So
      # check the staged tree before it is published, not after.
      #
      # The executable itself is not run. rudbgen has no headless flag — no
      # --version, no --help that returns without a window — and inventing one
      # for a smoke test would be a feature added for the test's benefit. What
      # can be checked without one is that the file is there and executable,
      # that the JAR is beside it in the place jvm.rs looks, and that the
      # runtime really answers as a Java runtime with the modules the drivers
      # need. That last check is the one with teeth, and it does run a program:
      # runtime/bin/java itself.
      #
      # Windows included: `runtime/bin/java` resolves to java.exe under Git
      # Bash, so one script covers all three runners.
      - name: Smoke-test the staged tree
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            contents="$STAGING/rudbgen.app/Contents"
            exe="$contents/MacOS/rudbgen"
            jar="$contents/lib/rudbgen-bridge.jar"
            runtime="$contents/runtime"
            templates="$contents/Resources/templates"
            sample="$contents/Resources/sample"
            drivers="$contents/Resources/drivers"
          else
            exe="$STAGING/rudbgen"
            if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
            jar="$STAGING/lib/rudbgen-bridge.jar"
            runtime="$STAGING/runtime"
            templates="$STAGING/templates"
            sample="$STAGING/sample"
            drivers="$STAGING/drivers"
          fi
          test -f "$exe" || { echo "no executable at $exe"; exit 1; }
          # Windows has no execute bit; everywhere else a tarred-up binary that
          # arrives without one is a download the user cannot run.
          if [ "$RUNNER_OS" != "Windows" ]; then
            test -x "$exe" || { echo "$exe is not executable"; exit 1; }
          fi
          test -f "$jar" || { echo "no bridge JAR at $jar"; exit 1; }
          for template in java_model.java mybatis_mapper.xml php_ci.php; do
            test -f "$templates/$template" || { echo "no $template under $templates"; exit 1; }
          done
          test -f "$sample/sample_h2.db.mv.db" || { echo "no sample database under $sample"; exit 1; }
          # Without the driver JAR the seeded sample connection is a NoDriverJar
          # error on a first run with no network.
          test -f "$drivers/h2-2.4.240.jar" || { echo "no H2 driver JAR under $drivers"; exit 1; }
          modules=$("$runtime/bin/java" --list-modules)
          for module in jdk.charsets jdk.unsupported; do
            if ! printf '%s\n' "$modules" | grep -q "^${module}@"; then
              echo "the bundled runtime is missing $module"
              printf '%s\n' "$modules"
              exit 1
            fi
          done
          echo "$exe, $jar and a runtime with $(printf '%s\n' "$modules" | wc -l) modules"

      # The second Windows artifact: an Inno Setup installer wrapped around the
      # very tree the step above just vouched for. The zip stays — the in-app
      # updater (rugpui-shell's update.rs) downloads and unpacks it, so
      # removing it would break every copy already installed. The installer is
      # what makes the package installable by winget: unzipping registers
      # nothing with Windows, and winget reads the "Apps & features" registry
      # entry to know which version is present and how to remove or upgrade it.
      # No ARP entry, no winget package.
      #
      # Inno Setup 6 comes and goes from the windows-latest image, so neither
      # "it is there" nor "it is not" is safe to assume: look in both Program
      # Files roots first and fall back to Chocolatey, which the image does
      # carry. `$version` drops the tag's "v" because VersionInfoVersion in the
      # script is a numeric quad and refuses a prefix, while the output file
      # name keeps the tag verbatim so it matches the zip beside it.
      - name: Build the installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Both Program Files roots, and a wildcard on the version folder so a
          # future "Inno Setup 7" (or whatever Chocolatey happens to lay down)
          # is still found rather than silently missed.
          function Find-Iscc {
            @("${env:ProgramFiles(x86)}", $env:ProgramFiles) |
              Where-Object { $_ } |
              ForEach-Object { Join-Path $_ "Inno Setup *\ISCC.exe" } |
              Get-Item -ErrorAction SilentlyContinue |
              Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup is not on this image; installing it with Chocolatey"
            choco install innosetup --no-progress -y
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found, even after installing Inno Setup" }
          Write-Host "compiling with $iscc"

          $version = "${{ github.ref_name }}" -replace '^v', ''
          $base = "rudbgen-${{ github.ref_name }}-${{ matrix.target }}-setup"
          # ISCC resolves a relative OutputDir against the script's own
          # directory, which would bury the installer in packaging\windows\.
          # Absolute paths for both ends, so it lands next to the zip.
          $source = (Resolve-Path $env:STAGING).Path
          $out = (Get-Location).Path
          & $iscc "/DVersion=$version" "/DSourceDir=$source" "/DOutputDir=$out" "/DOutputBaseFilename=$base" packaging\windows\rudbgen.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }

          $installer = Join-Path $out "$base.exe"
          if (-not (Test-Path $installer)) { throw "ISCC reported success but produced no $base.exe" }
          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Windows now uploads two files, so ASSET has to become multi-line,
          # which in GITHUB_ENV means the heredoc form. This later assignment
          # wins over the single-line ASSET the packaging step wrote. Written
          # through AppendAllText with explicit LFs rather than Out-File
          # because Out-File would end each line with CRLF on Windows and the
          # stray carriage returns would ride along inside the heredoc value,
          # turning the artifact paths into names that match nothing. Both
          # entries stay workspace-relative so upload-artifact resolves them
          # against the same root.
          $block = "ASSET<<RUDBGEN_ASSETS`n$env:ASSET`n$base.exe`nRUDBGEN_ASSETS`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $block)

      # Same certificate, same script, same caveats as the executable: the seal
      # is self-signed, so SmartScreen greets the installer exactly as it
      # greets the exe. Signing has to happen after ISCC runs, since the
      # installer is a fresh executable that embeds the payload rather than a
      # container copied around it.
      - name: Sign the installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./packaging/windows/sign.ps1 "$env:INSTALLER"

      # The staged tree gets checked before it is published; the installer
      # deserves the same, and for a sharper reason. Everything the installer
      # is for lives in side effects that no file listing can show: the
      # registry entry winget reads, and an uninstaller that can undo the
      # install. So run it for real, unattended, into a throwaway directory,
      # and then look at what it left behind.
      #
      # The three files checked are exactly the three the JVM loader needs:
      # miss any of them and the app opens its window and dies on the first
      # connection, which is the failure mode a single-file installer would
      # have shipped silently.
      #
      # The uninstall half is best-effort on purpose. Inno's uninstaller copies
      # itself to a temp directory and relaunches from there so it can delete
      # its own folder, which means the process Start-Process waited on has
      # already exited while the real work is still going. Polling for the
      # directory to vanish is the only handle available, and a slow runner
      # losing that race is not a reason to fail a release — the load-bearing
      # claim, that an uninstaller and an ARP entry exist at all, is already
      # proven above. So a timeout warns rather than throws.
      - name: Smoke-test the installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "rudbgen-install-check"
          $log = Join-Path $env:RUNNER_TEMP "rudbgen-install.log"
          $setup = Start-Process -FilePath $env:INSTALLER -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir", "/LOG=$log"
          if ($setup.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "the installer exited $($setup.ExitCode)"
          }

          foreach ($rel in @("rudbgen.exe", "lib\rudbgen-bridge.jar", "runtime\bin\java.exe")) {
            if (-not (Test-Path (Join-Path $dir $rel))) {
              throw "the installed tree is missing $rel"
            }
          }

          # The whole point of shipping an installer: winget looks the package
          # up here. The key name is the AppId from rudbgen.iss with Inno's
          # "_is1" suffix, under HKCU because the install is per-user, and it is
          # the same string ARP_KEY in crates/rudbgen-app/src/workspace/mod.rs names.
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{9A84AE34-E54B-46EA-B55D-61C0666D6890}_is1"
          $arp = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue
          if (-not $arp) { throw "the install left no Add/Remove Programs entry at $key" }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($arp.DisplayVersion -ne $version) {
            throw "Add/Remove Programs says $($arp.DisplayVersion), expected $version"
          }
          Write-Host "registered as $($arp.DisplayName) $($arp.DisplayVersion) in $dir"

          $uninstaller = Join-Path $dir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "no uninstaller at $uninstaller" }
          Start-Process -FilePath $uninstaller -Wait `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $dir) {
            Write-Host "::warning::the uninstaller had not finished clearing $dir after 120s"
          } else {
            Write-Host "uninstall removed $dir"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/checkout peels annotated tags to plain commits; re-fetch the
      # real tag object so its message is readable.
      - name: Read the tag annotation
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > release-body.md
          # A lightweight tag has no message; fall back to the subject line.
          if ! grep -q '[^[:space:]]' release-body.md; then
            git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}" > release-body.md
          fi
          cat release-body.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # One `sha256sum` line per asset, so a download can be checked with
      # `sha256sum --check --ignore-missing SHA256SUMS`. Written outside dist/
      # first so the file does not list itself.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: dist/*

  # Push the new version to the Windows Package Manager repository, so that
  # `winget upgrade` sees a release the moment it is published instead of
  # whenever somebody remembers to open a pull request by hand.
  #
  # THIS JOB CANNOT CREATE THE PACKAGE. `wingetcreate update` edits manifests
  # that already exist in microsoft/winget-pkgs; if Xcomart.Rudbgen is not
  # there yet it fails with "package not found". The first submission is a
  # manual step, done once, from the manifests kept in packaging/winget/ —
  # packaging/winget/README.md walks through it. Only once that pull request
  # has been merged is it worth creating the WINGET_PAT secret, a classic PAT
  # with `public_repo` scope on an account that has forked winget-pkgs.
  #
  # Until then the secret is absent and this job does nothing, which is
  # deliberate: a release must not fail because a downstream package
  # repository is not ready. The check happens inside the script rather than
  # in a step-level `if:` for the same reason the signing step does it that
  # way — the `secrets` context does not exist in `if:` expressions.
  winget:
    name: winget
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Submit the installer to winget-pkgs
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_PAT)) {
            Write-Host "winget submission skipped (no WINGET_PAT secret)"
            exit 0
          }

          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $url = "https://github.com/xcomart/rudbgen/releases/download/$tag/rudbgen-$tag-x86_64-pc-windows-msvc-setup.exe"

          # Fetched straight from its GitHub release rather than through
          # `winget install wingetcreate`: the winget CLI itself is not
          # dependably present on a hosted runner (it ships with the Desktop
          # App Installer, which needs a logged-in user session), whereas a
          # plain download works everywhere. A fixed release, checked against
          # the SHA256 its GitHub release lists for wingetcreate.exe, rather
          # than the publisher's "latest" permalink: this binary is handed
          # WINGET_PAT, so it must be exactly the one that was reviewed. To
          # upgrade, change both lines together.
          $wingetcreateVersion = "v1.12.13.0"
          $wingetcreateSha256 = "24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea"
          $exe = Join-Path $env:RUNNER_TEMP "wingetcreate.exe"
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/download/$wingetcreateVersion/wingetcreate.exe" -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash
          if ($actual -ne $wingetcreateSha256) {
            throw "wingetcreate.exe $wingetcreateVersion has SHA256 $actual, expected $wingetcreateSha256"
          }

          # --submit opens (or updates) the pull request against
          # microsoft/winget-pkgs from the token's fork; wingetcreate
          # downloads the installer from $url itself to compute its SHA256, so
          # the release assets must already be attached — hence needs: publish.
          & $exe update Xcomart.Rudbgen --version $version --urls $url --submit --token $env:WINGET_PAT
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate exited $LASTEXITCODE" }
