    author: Le champ Auteur de l'onglet Générer
    inStr: Texte écrit entre deux tours, jamais avant le premier ni après le dernier
    indent: Espaces ajoutés à l'indentation de ce qu'écrit inStr ; peut être négatif
    skipList: Noms d'éléments à sauter, séparés par des virgules et comparés à l'identique
  dec:
    abbr: Applique les règles d'abréviation à la valeur
    suffix: "Jette tout jusqu'au premier tiret bas : T_SAMPLE_ALBUM devient SAMPLE_ALBUM"
    prefix: "Jette tout à partir du dernier tiret bas : SAMPLE_ALBUM_T devient SAMPLE_ALBUM"
    camel: "Casse camel : SAMPLE_ALBUM devient sampleAlbum"
    pascal: "Casse pascal : SAMPLE_ALBUM devient SampleAlbum"
    snake: "Casse serpent : SAMPLE_ALBUM devient sample_album"
    screaming: "Casse serpent majuscule : sampleAlbum devient SAMPLE_ALBUM"
    skewer: "Casse kebab : SAMPLE_ALBUM devient sample-album"
    kebab: Un autre nom pour skewer
    lower: Minuscules
    upper: Majuscules
    replace: replace('de','vers') remplace chaque occurrence
    padSize: Complète la valeur par des espaces jusqu'à cette largeur
    padDir: De quel côté vont les espaces, left ou right ; à droite par défaut
    quote: Entoure la valeur de ce texte des deux côtés
    prepend: Écrit ce texte devant la valeur
    postpend: Écrit ce texte derrière la valeur
  cond:
    equals: Vrai quand la valeur est celle-ci, sans regarder la casse
    notEquals: Vrai quand la valeur est tout sauf celle-ci
    startsWith: Vrai quand la valeur commence par ceci, sans regarder la casse
    notStartsWith: Vrai quand la valeur ne commence pas par ceci
    endsWith: Vrai quand la valeur finit par ceci, sans regarder la casse
    notEndsWith: Vrai quand la valeur ne finit pas par ceci
    contains: Vrai quand une collection contient un élément de ce nom, ou qu'une liste à virgules contient cette valeur
    notContains: Vrai quand ni l'un ni l'autre
    matches: Vrai quand la valeur entière correspond à cette expression régulière ; ici la casse compte
    notMatches: Vrai quand la valeur entière n'y correspond pas
  opt:
    key: Le champ qu'écrit cette instruction, décorateurs compris
    item: Un autre nom pour key
    format: Comment la date est écrite, en lettres de motif Java comme yyyy-MM-dd

