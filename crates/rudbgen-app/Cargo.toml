[package]
name = "rudbgen-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The rudbgen binary: the window, the welcome screen, the settings and update dialogs"
build = "build.rs"

[[bin]]
name = "rudbgen"
path = "src/main.rs"

# Embeds assets/icon.ico into the Windows executable. gpui loads icon
# resource ID 1 for the window class, so one embedded icon covers Explorer,
# the taskbar and the window itself. That file is generated from
# `assets/icon.svg`; see `assets/README.md`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

# `windows` and `raw-window-handle` are used only by `src/caption.rs`, to colour
# the DWM title bar from the app theme. `windows-registry` is used only by
# `src/update.rs`, which rewrites the `DisplayVersion` of the "Apps & features"
# entry the Inno installer left behind, so that a copy which updates itself does
# not go on looking out of date to winget.
[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-registry.workspace = true
raw-window-handle.workspace = true

[dependencies]
rudbgen-core.workspace = true
# The session behind a connection: `Jvm::start`, `Session::open` and the
# `EXECUTE` the custom-query test runs. `src/connection.rs` is the only module
# that opens one, and `src/driver_manager.rs` reaches the same JVM for
# `probe_drivers`.
rudbgen-jdbc.workspace = true
# The table model behind the explorer tree and the inspector: `MetaReader`
# turns `DESCRIBE` and the four custom queries into schemas, table lists and
# whole tables. Every call it offers blocks, so every call site is on a
# background task holding a `SessionHandle`.
rudbgen-meta.workspace = true
# The inspector's Columns tab. The grid is the one widget in the tree that
# already lays a header, resizable columns and a virtualised body out, and a
# column list is exactly what it draws.
rudbgen-grid.workspace = true
# The generation job behind the Generate tab: `Plan`, `generate`, `dry_run` and
# `preview`. It knows nothing of gpui by design, so the shell is what puts the
# run on a background thread, pumps its `Progress` into the progress dialog and
# answers its overwrite question from a modal.
rudbgen-gen.workspace = true
# Local port forwarding through a bastion, for the connection dialog's tunnel
# block. Set up before the session opens and taken down after it closes; see
# `src/connection.rs`.
rudbgen-ssh.workspace = true
rudbgen-ui.workspace = true

# The tunnel registry in `src/connection.rs` is a process-wide map reached from
# background threads, and a panic while a tunnel is being opened must not make
# every other one unreachable — which is what `std`'s poisoning would do.
parking_lot.workspace = true
# `rudbgen-ssh`'s `HostKeyVerifier` is an async trait, and `src/connection.rs`
# implements it for the verifier that reads `known_hosts`.
async-trait.workspace = true

# The update check parses the GitHub releases API's answer, which is the one
# JSON document the shell reads that nothing in `rudbgen-core` owns.
serde_json.workspace = true
# The staging directory a self-update unpacks into is named after a fresh
# UUID, so two runs cannot collide in the temporary directory.
uuid.workspace = true
# The update dialog's download reports its progress back over a channel, which
# is what lets the bar move while the transfer is on a background thread.
futures.workspace = true
# The theme editor's catalogue hands file writes and deletions straight back
# from `rudbgen-ui::theme_store`, which reports them as `anyhow::Result`.
anyhow.workspace = true
# The export save dialog falls back to the user's home directory when the
# catalogue's own directory does not exist yet; `rudbgen-core` resolves the
# configuration directory but has no reason to expose the home one.
directories.workspace = true
gpui.workspace = true
# One call, in `main`: `gpui_platform::application()`. gpui's core no longer
# knows which windowing backend exists, so the façade is what links one in and
# hands back the `Application` the rest of `main` drives.
gpui_platform.workspace = true
log.workspace = true
env_logger.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
# One caller today — `src/update.rs`, which asks the GitHub releases API for
# the latest tag and then downloads the archive it names; the Maven driver
# downloader is the second, in M2. gpui's own `cx.http_client()` is a
# `NullHttpClient` unless the application installs one, and installing a real
# one to serve two background requests would be a much larger dependency. See
# the note beside the entry in the workspace manifest.
ureq.workspace = true
# Only for `src/update.rs`: the SHA-256 the self-updater checks a downloaded
# release asset against. Already linked as the crypto backend of both `russh`
# and `ureq`'s `rustls`, so this is an edge in the graph rather than a crate in
# the build.
ring.workspace = true

[dev-dependencies]
# gpui's headless test platform, for the behaviour that only exists once an
# element tree has been laid out. Test-only: the binary links gpui without it.
gpui = { workspace = true, features = ["test-support"] }
# The window-geometry round trip writes a real `settings.json` and reads it
# back, rather than mocking the configuration directory out.
tempfile.workspace = true
