# The servers the opt-in container tests run against.
#
# `crates/rudbgen-jdbc/tests/containers.rs` reads the catalog of a real
# PostgreSQL, MySQL, MariaDB, SQL Server, Oracle and Db2 — and of TiDB,
# CockroachDB and Firebird, through the dialect profiles rudbkit ships — through
# the bridge's DESCRIBE, which is the one thing about this layer that H2 cannot answer: a
# driver's metadata habits are per product. Nothing in the workspace needs these
# to be up:
# with the environment variables below unset every one of those tests passes
# by doing nothing, which is what keeps `cargo test --workspace` green on a
# machine with no Docker.
#
#     docker compose -f docker/compose.yml up -d
#     docker compose -f docker/compose.yml ps          # wait for "healthy"
#     docker compose -f docker/compose.yml down
#
# Then, from the repository root:
#
#     export RUDBGEN_TEST_PG_URL='jdbc:postgresql://127.0.0.1:55432/rudbgen'
#     export RUDBGEN_TEST_MYSQL_URL='jdbc:mysql://127.0.0.1:33306/rudbgen?allowPublicKeyRetrieval=true&useSSL=false'
#     export RUDBGEN_TEST_MARIADB_URL='jdbc:mariadb://127.0.0.1:53306/rudbgen'
#     export RUDBGEN_TEST_MSSQL_URL='jdbc:sqlserver://127.0.0.1:51433;encrypt=false'
#     export RUDBGEN_TEST_ORACLE_URL='jdbc:oracle:thin:@//127.0.0.1:51521/FREEPDB1'
#     export RUDBGEN_TEST_DB2_URL='jdbc:db2://127.0.0.1:55000/RUDBGEN'
#     export RUDBGEN_TEST_TIDB_URL='jdbc:mysql://127.0.0.1:54000/test?useSSL=false'
#     export RUDBGEN_TEST_COCKROACH_URL='jdbc:postgresql://127.0.0.1:56257/defaultdb?sslmode=disable'
#     export RUDBGEN_TEST_FIREBIRD_URL='jdbc:firebird://127.0.0.1:53050//var/lib/firebird/data/rudbgen.fdb?encoding=UTF8'
#     cargo test -p rudbgen-jdbc --test containers
#
# The user and the password default to `rudbgen`/`rudbgen`, matching this
# file, for every service except SQL Server; RUDBGEN_TEST_PG_USER,
# RUDBGEN_TEST_PG_PASSWORD, RUDBGEN_TEST_MYSQL_USER,
# RUDBGEN_TEST_MYSQL_PASSWORD, and their MARIADB/ORACLE/DB2/TIDB/COCKROACH/
# FIREBIRD counterparts override them. TiDB and CockroachDB are `root` with no
# password, as their images come. SQL Server has no `rudbgen` login of its own: the `sa` password
# complexity requirement rules out `rudbgen`, so its account is
# `sa` / `Rudbgen!Passw0rd`, and its image does not create a `rudbgen`
# database — a test that needs one creates it, or connects to `master`.
#
# The ports are deliberately not the standard ones (5432, 3306, 1433, 1521,
# 50000, ...). A developer with a server of their own running would otherwise find
# these shadowing it — or, worse, find the tests creating and dropping tables
# in it.
#
# The image tags are pinned, so that a metadata habit these tests pin down is
# pinned against a known server rather than against whatever "latest" resolved
# to on the day.
#
# The project name is set here rather than taken from this file's directory,
# `docker`, which rudbman's compose file shares along with these service names:
# `up` in one stack would otherwise replace the other's container of the same
# service. The two still share host ports, so run them one at a time. A
# container created before the name was set belongs to the project `docker`,
# and its fixed `container_name` makes `up` fail with "is already in use" until
# that container is removed (`docker rm rudbgen-test-postgres`, for example).

name: rudbgen

services:
  postgres:
    image: postgres:17
    container_name: rudbgen-test-postgres
    environment:
      POSTGRES_USER: rudbgen
      POSTGRES_PASSWORD: rudbgen
      POSTGRES_DB: rudbgen
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rudbgen -d rudbgen"]
      interval: 3s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: rudbgen-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rudbgen
      MYSQL_DATABASE: rudbgen
      MYSQL_USER: rudbgen
      MYSQL_PASSWORD: rudbgen
    ports:
      - "127.0.0.1:33306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 3s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:11
    container_name: rudbgen-test-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rudbgen
      MYSQL_DATABASE: rudbgen
      MYSQL_USER: rudbgen
      MYSQL_PASSWORD: rudbgen
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rudbgen-test-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Rudbgen!Passw0rd"
    ports:
      - "127.0.0.1:51433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"Rudbgen!Passw0rd\" -Q \"SELECT 1\" -b",
        ]
      interval: 3s
      timeout: 10s
      retries: 40

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: rudbgen-test-oracle
    environment:
      ORACLE_PASSWORD: rudbgen
      APP_USER: rudbgen
      APP_USER_PASSWORD: rudbgen
    ports:
      - "127.0.0.1:51521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 60

  # Db2 authenticates against the container's operating system, so there is
  # no separate database login to create: naming the instance `rudbgen` makes
  # its owner an OS user `rudbgen` with the password below, and that owner's
  # default schema is `RUDBGEN`. The image needs `privileged` to size the
  # kernel's IPC limits for the engine, and its first start creates the
  # database, which takes several minutes - hence the long start period.
  db2:
    image: icr.io/db2_community/db2:12.1.2.0
    container_name: rudbgen-test-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: rudbgen
      DB2INST1_PASSWORD: rudbgen
      DBNAME: RUDBGEN
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
      PERSISTENT_HOME: "false"
    ports:
      - "127.0.0.1:55000:50000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "su - rudbgen -c 'db2 connect to RUDBGEN >/dev/null && db2 terminate >/dev/null'",
        ]
      interval: 10s
      timeout: 30s
      start_period: 300s
      retries: 60

  # TiDB, on MySQL's wire protocol: one node, `root` with no password, and a
  # `test` database. Its image has no client to ask with, so the SQL port
  # answering is the server being up.
  tidb:
    image: pingcap/tidb:v8.5.8
    container_name: rudbgen-test-tidb
    ports:
      - "127.0.0.1:54000:4000"

  # CockroachDB, on PostgreSQL's wire protocol: one node, without TLS, `root`
  # with no password, and a `defaultdb` database.
  cockroach:
    image: cockroachdb/cockroach:v25.4.21
    container_name: rudbgen-test-cockroach
    command: start-single-node --insecure
    ports:
      - "127.0.0.1:56257:26257"
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--insecure", "-e", "select 1"]
      interval: 3s
      timeout: 10s
      retries: 40

  # Firebird, which no built-in reads: its profile stands on `generic`. The
  # image creates the database and its `rudbgen` user on the first start.
  firebird:
    image: firebirdsql/firebird:5.0.4
    container_name: rudbgen-test-firebird
    environment:
      FIREBIRD_ROOT_PASSWORD: rudbgen
      FIREBIRD_USER: rudbgen
      FIREBIRD_PASSWORD: rudbgen
      FIREBIRD_DATABASE: rudbgen.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    ports:
      - "127.0.0.1:53050:3050"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'select 1 from rdb$$database;' | /opt/firebird/bin/isql -q -u rudbgen -p rudbgen localhost:/var/lib/firebird/data/rudbgen.fdb",
        ]
      interval: 3s
      timeout: 10s
      retries: 40
