[workspace]
resolver = "3"
members = ["crates/*"]

# gpui is not taken from crates.io: 0.2.2 is still the newest published version
# and it predates the split of the crate into a platform-independent core
# (`gpui`), a façade that picks a backend at compile time (`gpui_platform`) and
# the backends themselves, which is the shape every API below is written
# against. It comes from a pinned revision of Zed's monorepo instead — a
# revision and never a branch, because the monorepo's main moves several times a
# day and a floating dependency would make two checkouts of this repository
# build different applications.
#
# Four of those crates carry patches, for four things Zed has no answer of its
# own for: moving an open window between the platform's caption and the
# application's own, the X11 backend running its close callbacks with the client
# `RefCell` borrowed, X11's `is_transparent` ignoring client-side decorations,
# and X11 having no counterpart to Wayland's `org_kde_kwin_blur`. rudbgen does
# not carry those trees itself: `rugpui` — the widget kit this application draws
# with, and which is written against the same gpui — vendors them and documents
# them hunk by hunk in its own root manifest. The table below simply points at
# rugpui's copies, so that there is one vendored gpui and not two.
#
# The patch table is not optional and its four entries are not optional either.
# Without it this workspace would resolve gpui from Zed's monorepo while `rugpui`
# resolved it from the patched copy, two gpui crates would end up in one binary,
# and the `Global`s the widgets install would be invisible to the application.
#
# `rugpui` and the three crates built on it are `git` dependencies now that
# `https://github.com/xcomart/rugpui` is published, and the four gpui crates
# below are pinned the same way. All eight entries — the four crates in
# `[workspace.dependencies]` and the four here — name the *same* revision:
# that is what makes them one source rather than several checkouts of the
# same repository, and so what keeps one gpui in the link. Bumping to a newer
# rugpui revision means moving all eight together.
#
# Working on rugpui and rudbgen at once still works without publishing every
# change: a `.cargo/config.toml` at the repository root (not committed) can
# carry
#     [patch."https://github.com/xcomart/rugpui"]
#     rugpui = { path = "../rugpui/crates/rugpui" }
#     rugpui-grid = { path = "../rugpui/crates/rugpui-grid" }
#     rugpui-editor = { path = "../rugpui/crates/rugpui-editor" }
#     rugpui-shell = { path = "../rugpui/crates/rugpui-shell" }
# to override the git dependencies with a sibling checkout; the four vendored
# gpui crates below can be overridden by path the same way if they, too, are
# being edited locally.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/xcomart/rugpui", rev = "8810c93ddc2382276c60f20d5317b87f8cf7e31b" }
gpui_linux = { git = "https://github.com/xcomart/rugpui", rev = "8810c93ddc2382276c60f20d5317b87f8cf7e31b" }
gpui_macos = { git = "https://github.com/xcomart/rugpui", rev = "8810c93ddc2382276c60f20d5317b87f8cf7e31b" }
gpui_windows = { git = "https://github.com/xcomart/rugpui", rev = "8810c93ddc2382276c60f20d5317b87f8cf7e31b" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["rudbgen contributors"]
repository = "https://github.com/xcomart/rudbgen"

[workspace.dependencies]
# --- shared utilities ---
anyhow = "1"
# `anyhow` is for the application's own error paths; `thiserror` is for the
# library ones that callers match on. `rudbgen-jdbc` needs the second kind: a
# caller has to be able to tell a SQL error from a driver error from a protocol
# error without parsing a message.
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
keyring = "4"
unicode-segmentation = "1"

# Auto-fitting a grid column to its contents needs the *display* width of a
# string rather than its length in `char`s, so that a column of Korean names
# is not fitted to half the width it needs.
unicode-width = "0.2"
tempfile = "3"
# Fair, non-poisoning mutexes. `rudbgen-jdbc` keeps a JVM handle and a session
# registry behind one each, and a panic while a session is being opened must not
# leave the whole JVM unreachable, which is exactly what `std`'s poisoning does.
parking_lot = "0.12"

# --- text buffer: the code editor's document ---
# A rope, because the editor holds whole template files and stays responsive
# whatever their size: an insert is O(log n) rather than the memmove a `String`
# would do, and line lookups are O(log n) rather than a scan. Two of its
# indexes are load bearing beyond that — `byte_to_line`/`line_to_byte` are what
# let the syntax cache address the buffer by line, and
# `char_to_utf16_cu`/`utf16_cu_to_char` are what make the IME's UTF-16 offsets
# convertible in O(log n) instead of the whole-string walk a flat buffer needs
# on every composition step. Default features are off so that a line break is
# `\n` or `\r\n` and nothing else: with `unicode_lines` a `\u{2028}` inside a
# quoted template value would split a line in the rope that the highlighter
# does not split, and the two views of the buffer have to agree.
ropey = { version = "1.6", default-features = false, features = [
    "cr_lines",
    "simd",
] }

# --- HTTP: the driver downloader ---
# Maven Central is the only host rudbgen itself fetches from — `rugpui-shell`'s
# updater talks to the GitHub releases API through a client of its own — and it
# is fetched from a background thread that is already blocking on a file write,
# so a synchronous client is the right shape and an async runtime would be a
# second one beside the tunnel's. `ureq` is the smallest such client that still
# speaks TLS. `rustls` is pinned to the `ring` provider for the same reason
# `russh` is: `aws-lc-rs` needs NASM to build on Windows. `gzip` is kept because
# the shell's own `ureq` resolves to the union of the features named across the
# graph, and the GitHub API answers with compressed JSON.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "_ring",
    "gzip",
] }

# --- jdbgen's two encryption schemes, read once by `rudbgen-import` (D5) ---
# rudbgen has no master password and encrypts nothing; these are here to *read*
# a `config.json` written by jdbgen, whose `connectionUrl`, `userName` and
# `userPassword` are the only encrypted values in the file. The scheme is
# jdbgen's `StrUtils`, reproduced exactly:
#
#   * current form — `"ENC2:" + Base64(salt(16) || iv(12) || AES-256-GCM)`, the
#     key stretched with PBKDF2-HMAC-SHA256 over 210,000 iterations: `aes-gcm`
#     for the cipher, `pbkdf2` + `sha2` for the derivation,
#   * superseded form — unprefixed Base64 of AES-128/CBC/PKCS#5 whose key and IV
#     are the two halves of SHA-256(master): `cbc` over `aes`, `sha2` again,
#   * `base64` decodes both envelopes.
#
# Every version below is one the lockfile already carried for `russh` and
# `ureq`'s `rustls`, and they are all of one RustCrypto generation (`cipher`
# 0.5, `digest` 0.11), so the set adds dependency *edges* and not crates.
# `aes-gcm` drops its default `getrandom`: nothing here ever encrypts, so the
# crate must not pull a random source in to seed nonces it will not draw.
# `zeroize` is what lets the import promise that the master password is gone
# once the wizard closes — it is wiped when the decryptor is dropped rather
# than left in a `String` for the allocator to hand out again.
aes-gcm = { version = "0.11", default-features = false, features = [
    "aes",
    "alloc",
] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = "0.11"
base64 = "0.23"
zeroize = "1"

# --- the Windows resource compiler ---
# Used by `rudbgen-app` alone, and only as a build-dependency under a
# `[target.'cfg(windows)']` section, so a build for another platform never sees
# it. It embeds `assets/icon.ico` into the Windows executable at resource ID 1,
# which is the id gpui's Windows backend loads for the window class icon.
#
# The three crates that used to sit beside it — `windows`, `windows-registry`
# and `raw-window-handle` — went with the code that named them: pinning the DWM
# caption to the app theme and correcting the `DisplayVersion` in the uninstall
# entry after a self-update are both `rugpui-shell`'s now, and it declares them
# itself.
winresource = "0.1"

# --- localization ---
# `rust-i18n` compiles `crates/rudbgen-app/locales/*.yml` into the binary, so
# there is no runtime asset to ship; `sys-locale` is only consulted when the
# user has not pinned a language in `settings.json`. Declared here ahead of the
# app crate that uses them, because the eight locales are M0 work and pinning
# the versions once is what keeps a later addition from resolving differently.
rust-i18n = "4"
sys-locale = "0.3"

# --- GUI: Zed's GPU-accelerated UI framework ---
# Two crates, one revision, and the revision has to be spelled out in both: a
# git dependency is identified by URL *and* revision, so naming the same commit
# twice is what makes them one source rather than two checkouts of the same
# repository. See the patch table at the top of this file for why a revision at
# all, and for what the patched copies put back on top of it.
#
# `gpui` is the platform-independent core, and everything the application
# writes is against it. `gpui_platform` is the façade that links a backend in
# and starts it — `application()` where 0.2.2 had `Application::new()`. Its
# features are empty by default and the backend inherits them, so the two
# display servers Linux might be running under have to be asked for by name;
# `font-kit` is macOS's text stack and is inert elsewhere.
gpui = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", features = [
    "font-kit",
    "wayland",
    "x11",
] }

# --- async runtime (SSH tunnel only) ---
# The tunnel is the only thing here that speaks a network protocol of its own.
# `net` and `io-util` carry the forwarded sockets, `sync` the shutdown signal;
# there is no `fs`, because nothing this transport does touches a file.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }
futures = "0.3"
async-trait = "0.1"

# --- SSH.  NOTE: default features pull in `aws-lc-rs`, whose build requires
# NASM on Windows.  The `ring` backend builds everywhere with no extra tooling. ---
russh = { version = "0.62", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }

# --- JNI: the JDBC bridge.  `invocation` is what lets the process create its
# own JVM rather than be loaded into one. ---
jni = { version = "0.22", features = ["invocation"] }

# --- the widget kit ---
# `rugpui` is the gpui widget kit these three applications share — rulogman,
# rudbman and rudbgen — extracted so that a fix made once is a fix everywhere.
# `rugpui-grid` is the virtualised result grid and `rugpui-editor` the code editor.
#
# `rugpui-shell` is the layer *above* the widgets, and it is here for the same
# reason the kit is: the window that draws its own title bar, the self-updater,
# the about and update dialogs, the split-pane tree, the palette editor and the
# pieces a settings form is built out of were each written once in this
# repository and then copied twice. It knows nothing about rudbgen — the name,
# the version, the release endpoints, the words and the ignored-release tag are
# all injected by `main` at start-up.
#
# All four are built on `rugpui` and taken at one revision along with the gpui the
# patch table at the top of this file points at.
rugpui = { git = "https://github.com/xcomart/rugpui", rev = "8810c93ddc2382276c60f20d5317b87f8cf7e31b" }
rugpui-grid = { git = "https://github.com/xcomart/rugpui", rev = "8810c93ddc2382276c60f20d5317b87f8cf7e31b" }
rugpui-editor = { git = "https://github.com/xcomart/rugpui", rev = "8810c93ddc2382276c60f20d5317b87f8cf7e31b" }
rugpui-shell = { git = "https://github.com/xcomart/rugpui", rev = "8810c93ddc2382276c60f20d5317b87f8cf7e31b" }

# --- internal crates ---
rudbgen-core = { path = "crates/rudbgen-core" }
rudbgen-ssh = { path = "crates/rudbgen-ssh" }
rudbgen-jdbc = { path = "crates/rudbgen-jdbc" }
rudbgen-meta = { path = "crates/rudbgen-meta" }
rudbgen-template = { path = "crates/rudbgen-template" }
rudbgen-gen = { path = "crates/rudbgen-gen" }
rudbgen-import = { path = "crates/rudbgen-import" }
rudbgen-app = { path = "crates/rudbgen-app" }

[profile.dev]
# gpui + its dependency tree is large; keep debug builds usable.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
